---
# ==============================================================================
# Cluster Backup Playbook - Automated Multi-Tier Disaster Recovery
# ==============================================================================
# Usage:
#   ansible-playbook -i inventory.ini backup_cluster.yml
#
# Custom destination overrides:
#   ansible-playbook -i inventory.ini backup_cluster.yml -e "backup_destination_type=remote_ssh"
# ==============================================================================

- name: Initialize Backup Run & Generate Execution Manifest
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/backup_config.yml
  tasks:
    - name: Set backup execution timestamp
      ansible.builtin.set_fact:
        backup_ts: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

    - name: Ensure local backup archive directory exists
      ansible.builtin.file:
        path: "{{ backup_local_dir }}/{{ backup_ts }}"
        state: directory
        mode: "0750"

    - name: Display backup initiation banner
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "Starting Cluster Backup Execution"
          - "Timestamp:    {{ backup_ts }}"
          - "Destination:  {{ backup_destination_type }}"
          - "Local Target: {{ backup_local_dir }}/{{ backup_ts }}"
          - "=================================================="

- name: Backup Frontend Load Balancers & Edge Proxies
  hosts: proxies
  gather_facts: false
  become: true
  vars_files:
    - vars/backup_config.yml
  vars:
    backup_ts: "{{ hostvars['localhost']['backup_ts'] }}"
  tasks:
    - name: Check candidate proxy directories
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/haproxy
        - /etc/keepalived
        - /etc/ssl/internal
        - /root/.acme.sh
      register: proxy_stat_results

    - name: Assemble existing candidate paths
      ansible.builtin.set_fact:
        proxy_backup_paths: "{{ proxy_stat_results.results | selectattr('stat.exists') | map(attribute='item') | list }}"

    - name: Ensure remote staging directory exists
      ansible.builtin.file:
        path: "{{ backup_staging_dir }}"
        state: directory
        mode: "0700"

    - name: Archive proxy configurations and certificates
      community.general.archive:
        path: "{{ proxy_backup_paths }}"
        dest: "{{ backup_staging_dir }}/proxy_{{ inventory_hostname }}_{{ backup_ts }}.tar.{{ backup_compression }}"
        format: "{{ backup_compression }}"
        mode: "0600"
      when: proxy_backup_paths | length > 0

    - name: Fetch proxy archive to Ansible controller
      ansible.builtin.fetch:
        src: "{{ backup_staging_dir }}/proxy_{{ inventory_hostname }}_{{ backup_ts }}.tar.{{ backup_compression }}"
        dest: "{{ backup_local_dir }}/{{ backup_ts }}/proxy_{{ inventory_hostname }}.tar.{{ backup_compression }}"
        flat: true
      when: proxy_backup_paths | length > 0

    - name: Remove temporary proxy staging archive
      ansible.builtin.file:
        path: "{{ backup_staging_dir }}/proxy_{{ inventory_hostname }}_{{ backup_ts }}.tar.{{ backup_compression }}"
        state: absent

- name: Backup Backend Webservers & Application Nodes
  hosts: webservers
  gather_facts: false
  become: true
  vars_files:
    - vars/backup_config.yml
  vars:
    backup_ts: "{{ hostvars['localhost']['backup_ts'] }}"
  tasks:
    - name: Check candidate webserver directories
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/nginx
        - /etc/ssl/internal
        - /var/www
      register: web_stat_results

    - name: Assemble existing webserver candidate paths
      ansible.builtin.set_fact:
        web_backup_paths: "{{ web_stat_results.results | selectattr('stat.exists') | map(attribute='item') | list }}"

    - name: Ensure remote staging directory exists
      ansible.builtin.file:
        path: "{{ backup_staging_dir }}"
        state: directory
        mode: "0700"

    - name: Archive webserver configurations and site contents
      community.general.archive:
        path: "{{ web_backup_paths }}"
        dest: "{{ backup_staging_dir }}/webserver_{{ inventory_hostname }}_{{ backup_ts }}.tar.{{ backup_compression }}"
        format: "{{ backup_compression }}"
        mode: "0600"
      when: web_backup_paths | length > 0

    - name: Fetch webserver archive to Ansible controller
      ansible.builtin.fetch:
        src: "{{ backup_staging_dir }}/webserver_{{ inventory_hostname }}_{{ backup_ts }}.tar.{{ backup_compression }}"
        dest: "{{ backup_local_dir }}/{{ backup_ts }}/webserver_{{ inventory_hostname }}.tar.{{ backup_compression }}"
        flat: true
      when: web_backup_paths | length > 0

    - name: Remove temporary webserver staging archive
      ansible.builtin.file:
        path: "{{ backup_staging_dir }}/webserver_{{ inventory_hostname }}_{{ backup_ts }}.tar.{{ backup_compression }}"
        state: absent

- name: Backup Teleport Zero-Trust Access Gateway & Storage
  hosts: teleport_servers
  gather_facts: false
  become: true
  vars_files:
    - vars/backup_config.yml
  vars:
    backup_ts: "{{ hostvars['localhost']['backup_ts'] }}"
  tasks:
    - name: Check candidate Teleport directories
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/teleport.yaml
        - /var/lib/teleport
      register: teleport_stat_results

    - name: Assemble existing Teleport candidate paths
      ansible.builtin.set_fact:
        teleport_backup_paths: "{{ teleport_stat_results.results | selectattr('stat.exists') | map(attribute='item') | list }}"

    - name: Ensure remote staging directory exists
      ansible.builtin.file:
        path: "{{ backup_staging_dir }}"
        state: directory
        mode: "0700"

    - name: Archive Teleport configuration and cryptographic state
      community.general.archive:
        path: "{{ teleport_backup_paths }}"
        dest: "{{ backup_staging_dir }}/teleport_{{ inventory_hostname }}_{{ backup_ts }}.tar.{{ backup_compression }}"
        format: "{{ backup_compression }}"
        mode: "0600"
      when: teleport_backup_paths | length > 0

    - name: Fetch Teleport archive to Ansible controller
      ansible.builtin.fetch:
        src: "{{ backup_staging_dir }}/teleport_{{ inventory_hostname }}_{{ backup_ts }}.tar.{{ backup_compression }}"
        dest: "{{ backup_local_dir }}/{{ backup_ts }}/teleport_{{ inventory_hostname }}.tar.{{ backup_compression }}"
        flat: true
      when: teleport_backup_paths | length > 0

    - name: Remove temporary Teleport staging archive
      ansible.builtin.file:
        path: "{{ backup_staging_dir }}/teleport_{{ inventory_hostname }}_{{ backup_ts }}.tar.{{ backup_compression }}"
        state: absent

- name: Backup Prometheus & Grafana Monitoring Tier
  hosts: monitoring
  gather_facts: false
  become: true
  vars_files:
    - vars/backup_config.yml
  vars:
    backup_ts: "{{ hostvars['localhost']['backup_ts'] }}"
  tasks:
    - name: Check candidate monitoring directories
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/prometheus
        - /etc/grafana
        - /var/lib/grafana/grafana.db
      register: mon_stat_results

    - name: Assemble existing monitoring candidate paths
      ansible.builtin.set_fact:
        mon_backup_paths: "{{ mon_stat_results.results | selectattr('stat.exists') | map(attribute='item') | list }}"

    - name: Ensure remote staging directory exists
      ansible.builtin.file:
        path: "{{ backup_staging_dir }}"
        state: directory
        mode: "0700"

    - name: Archive monitoring configuration and dashboards
      community.general.archive:
        path: "{{ mon_backup_paths }}"
        dest: "{{ backup_staging_dir }}/monitoring_{{ inventory_hostname }}_{{ backup_ts }}.tar.{{ backup_compression }}"
        format: "{{ backup_compression }}"
        mode: "0600"
      when: mon_backup_paths | length > 0

    - name: Fetch monitoring archive to Ansible controller
      ansible.builtin.fetch:
        src: "{{ backup_staging_dir }}/monitoring_{{ inventory_hostname }}_{{ backup_ts }}.tar.{{ backup_compression }}"
        dest: "{{ backup_local_dir }}/{{ backup_ts }}/monitoring_{{ inventory_hostname }}.tar.{{ backup_compression }}"
        flat: true
      when: mon_backup_paths | length > 0

    - name: Remove temporary monitoring staging archive
      ansible.builtin.file:
        path: "{{ backup_staging_dir }}/monitoring_{{ inventory_hostname }}_{{ backup_ts }}.tar.{{ backup_compression }}"
        state: absent

- name: Backup Database Tier (PostgreSQL / MySQL)
  hosts: databases
  gather_facts: false
  become: true
  vars_files:
    - vars/backup_config.yml
  vars:
    backup_ts: "{{ hostvars['localhost']['backup_ts'] }}"
  tasks:
    - name: Ensure remote staging directory exists
      ansible.builtin.file:
        path: "{{ backup_staging_dir }}"
        state: directory
        mode: "0700"

    - name: Dump all PostgreSQL databases if postgresql service is active
      ansible.builtin.shell:
        cmd: "su - postgres -c 'pg_dumpall' | gzip > {{ backup_staging_dir }}/postgres_{{ inventory_hostname }}_{{ backup_ts }}.sql.gz"
      failed_when: false
      changed_when: true

    - name: Dump all MySQL databases if mysql service is active
      ansible.builtin.shell:
        cmd: "mysqldump --all-databases --single-transaction | gzip > {{ backup_staging_dir }}/mysql_{{ inventory_hostname }}_{{ backup_ts }}.sql.gz"
      failed_when: false
      changed_when: true

    - name: Find generated database SQL dumps
      ansible.builtin.find:
        paths: "{{ backup_staging_dir }}"
        patterns: "*_{{ inventory_hostname }}_{{ backup_ts }}.sql.gz"
      register: db_dump_files

    - name: Fetch database dumps to Ansible controller
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ backup_local_dir }}/{{ backup_ts }}/{{ item.path | basename }}"
        flat: true
      loop: "{{ db_dump_files.files }}"

    - name: Remove temporary database dump staging files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ db_dump_files.files }}"

- name: Backup Redis In-Memory Cache Tier
  hosts: redis_servers
  gather_facts: false
  become: true
  vars_files:
    - vars/backup_config.yml
  vars:
    backup_ts: "{{ hostvars['localhost']['backup_ts'] }}"
  tasks:
    - name: Ensure remote staging directory exists
      ansible.builtin.file:
        path: "{{ backup_staging_dir }}"
        state: directory
        mode: "0700"

    - name: Trigger Redis background save snapshot (bgsave)
      ansible.builtin.command:
        cmd: >
          redis-cli -p {{ redis_tls_port | default(redis_port | default(6379)) }}
          {% if redis_enable_tls | default(enable_internal_tls | default(false)) | bool %}--tls --cacert {{ redis_ca_cert | default('/etc/ssl/certs/internal-ca.crt') }}{% endif %}
          {% if redis_password is defined and redis_password %} -a '{{ redis_password }}'{% endif %}
          bgsave
      failed_when: false
      changed_when: true
      no_log: true

    - name: Wait for Redis background save to complete
      ansible.builtin.pause:
        seconds: 2

    - name: Check candidate Redis backup files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/lib/redis/dump.rdb
        - /var/lib/redis/appendonly.aof
        - /etc/redis/redis.conf
      register: redis_stat_results

    - name: Assemble existing Redis backup paths
      ansible.builtin.set_fact:
        redis_backup_paths: "{{ redis_stat_results.results | selectattr('stat.exists') | map(attribute='item') | list }}"

    - name: Archive Redis snapshot and configuration
      community.general.archive:
        path: "{{ redis_backup_paths }}"
        dest: "{{ backup_staging_dir }}/redis_{{ inventory_hostname }}_{{ backup_ts }}.tar.{{ backup_compression }}"
        format: "{{ backup_compression }}"
        mode: "0600"
      when: redis_backup_paths | length > 0

    - name: Fetch Redis archive to Ansible controller
      ansible.builtin.fetch:
        src: "{{ backup_staging_dir }}/redis_{{ inventory_hostname }}_{{ backup_ts }}.tar.{{ backup_compression }}"
        dest: "{{ backup_local_dir }}/{{ backup_ts }}/redis_{{ inventory_hostname }}.tar.{{ backup_compression }}"
        flat: true
      when: redis_backup_paths | length > 0

    - name: Remove temporary Redis staging archive
      ansible.builtin.file:
        path: "{{ backup_staging_dir }}/redis_{{ inventory_hostname }}_{{ backup_ts }}.tar.{{ backup_compression }}"
        state: absent

- name: Backup RabbitMQ Message Broker Definitions & State
  hosts: rabbitmq_servers
  gather_facts: false
  become: true
  vars_files:
    - vars/backup_config.yml
  vars:
    backup_ts: "{{ hostvars['localhost']['backup_ts'] }}"
  tasks:
    - name: Ensure remote staging directory exists
      ansible.builtin.file:
        path: "{{ backup_staging_dir }}"
        state: directory
        mode: "0700"

    - name: Export RabbitMQ schema and broker definitions
      ansible.builtin.command:
        cmd: "rabbitmqctl export_definitions {{ backup_staging_dir }}/rabbitmq_definitions_{{ inventory_hostname }}_{{ backup_ts }}.json"
      failed_when: false
      changed_when: true

    - name: Check candidate RabbitMQ backup paths
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ backup_staging_dir }}/rabbitmq_definitions_{{ inventory_hostname }}_{{ backup_ts }}.json"
        - /etc/rabbitmq
        - /var/lib/rabbitmq/.erlang.cookie
      register: rmq_stat_results

    - name: Assemble existing RabbitMQ backup paths
      ansible.builtin.set_fact:
        rmq_backup_paths: "{{ rmq_stat_results.results | selectattr('stat.exists') | map(attribute='item') | list }}"

    - name: Archive RabbitMQ definitions and configuration
      community.general.archive:
        path: "{{ rmq_backup_paths }}"
        dest: "{{ backup_staging_dir }}/rabbitmq_{{ inventory_hostname }}_{{ backup_ts }}.tar.{{ backup_compression }}"
        format: "{{ backup_compression }}"
        mode: "0600"
      when: rmq_backup_paths | length > 0

    - name: Fetch RabbitMQ archive to Ansible controller
      ansible.builtin.fetch:
        src: "{{ backup_staging_dir }}/rabbitmq_{{ inventory_hostname }}_{{ backup_ts }}.tar.{{ backup_compression }}"
        dest: "{{ backup_local_dir }}/{{ backup_ts }}/rabbitmq_{{ inventory_hostname }}.tar.{{ backup_compression }}"
        flat: true
      when: rmq_backup_paths | length > 0

    - name: Remove temporary RabbitMQ staging files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ backup_staging_dir }}/rabbitmq_definitions_{{ inventory_hostname }}_{{ backup_ts }}.json"
        - "{{ backup_staging_dir }}/rabbitmq_{{ inventory_hostname }}_{{ backup_ts }}.tar.{{ backup_compression }}"

- name: Backup FreeIPA Centralized Identity & Directory State
  hosts: freeipa_servers
  gather_facts: false
  become: true
  vars_files:
    - vars/backup_config.yml
  vars:
    backup_ts: "{{ hostvars['localhost']['backup_ts'] }}"
  tasks:
    - name: Ensure remote staging directory exists
      ansible.builtin.file:
        path: "{{ backup_staging_dir }}"
        state: directory
        mode: "0700"

    - name: Execute FreeIPA native data backup
      ansible.builtin.command:
        cmd: "ipa-backup --data --no-logs"
      failed_when: false
      changed_when: true

    - name: Check candidate FreeIPA backup paths
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/lib/ipa/backup
        - /etc/ipa
        - /etc/dirsrv
        - /etc/krb5.conf
      register: ipa_stat_results

    - name: Assemble existing FreeIPA backup paths
      ansible.builtin.set_fact:
        ipa_backup_paths: "{{ ipa_stat_results.results | selectattr('stat.exists') | map(attribute='item') | list }}"

    - name: Archive FreeIPA configurations and backup archives
      community.general.archive:
        path: "{{ ipa_backup_paths }}"
        dest: "{{ backup_staging_dir }}/freeipa_{{ inventory_hostname }}_{{ backup_ts }}.tar.{{ backup_compression }}"
        format: "{{ backup_compression }}"
        mode: "0600"
      when: ipa_backup_paths | length > 0

    - name: Fetch FreeIPA archive to Ansible controller
      ansible.builtin.fetch:
        src: "{{ backup_staging_dir }}/freeipa_{{ inventory_hostname }}_{{ backup_ts }}.tar.{{ backup_compression }}"
        dest: "{{ backup_local_dir }}/{{ backup_ts }}/freeipa_{{ inventory_hostname }}.tar.{{ backup_compression }}"
        flat: true
      when: ipa_backup_paths | length > 0

    - name: Remove temporary FreeIPA staging archive
      ansible.builtin.file:
        path: "{{ backup_staging_dir }}/freeipa_{{ inventory_hostname }}_{{ backup_ts }}.tar.{{ backup_compression }}"
        state: absent

- name: Finalize Backup Dispatch & Offsite Synchronization
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/backup_config.yml
  vars:
    backup_ts: "{{ hostvars['localhost']['backup_ts'] }}"
  tasks:
    - name: Find collected backup archives on controller
      ansible.builtin.find:
        paths: "{{ backup_local_dir }}/{{ backup_ts }}"
        patterns:
          - "*.tar.*"
          - "*.sql.gz"
      register: local_archives

    - name: Dispatch archives to remote SSH / SFTP backup server
      ansible.builtin.command:
        cmd: >
          scp -P {{ backup_remote_ssh_port }} -i {{ backup_remote_ssh_key }} -o StrictHostKeyChecking=no
          {{ backup_local_dir }}/{{ backup_ts }}/*
          {{ backup_remote_ssh_user }}@{{ backup_remote_ssh_host }}:{{ backup_remote_ssh_dir }}/
      when:
        - backup_destination_type == 'remote_ssh'
        - local_archives.matched > 0
      changed_when: true

    - name: Upload archives to S3 / MinIO object storage
      ansible.builtin.command:
        cmd: >
          aws s3 cp {{ backup_local_dir }}/{{ backup_ts }}/
          s3://{{ backup_s3_bucket }}/{{ backup_s3_prefix }}/{{ backup_ts }}/
          --recursive
          {% if backup_s3_endpoint_url | length > 0 %}--endpoint-url {{ backup_s3_endpoint_url }}{% endif %}
      environment:
        AWS_ACCESS_KEY_ID: "{{ backup_s3_access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ backup_s3_secret_key }}"
        AWS_DEFAULT_REGION: "{{ backup_s3_region }}"
      when:
        - backup_destination_type == 's3'
        - backup_s3_access_key | length > 0
        - local_archives.matched > 0
      changed_when: true

    # --------------------------------------------------------------------------
    # Rclone Multi-Cloud Synchronization & Lifecycle Retention
    # --------------------------------------------------------------------------
    - name: Check for rclone installation on Ansible controller
      ansible.builtin.command: which rclone
      register: rclone_check
      failed_when: false
      changed_when: false
      when: backup_destination_type == 'rclone'

    - name: Ensure rclone is installed if missing
      ansible.builtin.apt:
        name: rclone
        state: present
      become: true
      when:
        - backup_destination_type == 'rclone'
        - rclone_check.rc != 0
        - backup_rclone_auto_install | default(true) | bool

    - name: Synchronize backup archives to remote destination via rclone
      ansible.builtin.command:
        cmd: >
          rclone copy {{ backup_local_dir }}/{{ backup_ts }}/
          {{ backup_rclone_remote }}:{{ backup_rclone_path }}/{{ backup_ts }}/
          {% if backup_rclone_config | default('') | length > 0 %}--config {{ backup_rclone_config }}{% endif %}
          {% if backup_rclone_bandwidth_limit | default('') | length > 0 %}--bwlimit {{ backup_rclone_bandwidth_limit }}{% endif %}
          {{ backup_rclone_flags | default('--fast-list --transfers 4 --checkers 8') }}
      when:
        - backup_destination_type == 'rclone'
        - local_archives.matched > 0
      changed_when: true

    - name: Purge old backup snapshots on rclone remote exceeding retention window
      ansible.builtin.command:
        cmd: >
          rclone delete {{ backup_rclone_remote }}:{{ backup_rclone_path }}/
          --min-age {{ backup_retention_days | default(30) }}d
          {% if backup_rclone_config | default('') | length > 0 %}--config {{ backup_rclone_config }}{% endif %}
      when:
        - backup_destination_type == 'rclone'
        - backup_rclone_enable_retention_cleanup | default(true) | bool
      failed_when: false
      changed_when: true

    - name: Display backup manifest summary
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "Backup Execution Successfully Completed!"
          - "Archive Directory: {{ backup_local_dir }}/{{ backup_ts }}"
          - "Total Archives:    {{ local_archives.matched }}"
          - "Target Host Type:  {{ backup_destination_type }}"
          - "=================================================="
