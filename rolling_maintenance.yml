      ansible.builtin.uri:
        url: "{{ 'https' if (grafana_enable_tls | default(enable_internal_tls | default(false)) | bool) else 'http' }}://127.0.0.1:{{ grafana_port | default(3000) }}/api/health"
        validate_certs: false
        status_code: 200
      retries: 10
      delay: 3
      register: grafana_health
      until: grafana_health.status == 200
      failed_when: false

    - name: Confirm Monitoring node is healthy and restored
      ansible.builtin.debug:
        msg: ">>> Monitoring node {{ inventory_hostname }} successfully updated and verified <<<"

