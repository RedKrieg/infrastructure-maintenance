    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
      register: redis_apt_cache
      retries: 3
      delay: 5
      until: redis_apt_cache is succeeded

    - name: Apply security and OS package updates (preserving configurations)
      ansible.builtin.apt:
        upgrade: dist
        dpkg_options: 'force-confdef,force-confold'

    - name: Check if kernel reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: redis_reboot_file

    - name: Reboot Redis node if updates require it
      ansible.builtin.reboot:
        msg: "Rebooting Redis node {{ inventory_hostname }} following rolling system upgrades"
        connect_timeout: 10
        reboot_timeout: 300
        pre_reboot_delay: 2
        post_reboot_delay: 5
      when: redis_reboot_file.stat.exists or (force_reboot | bool)

    - name: Ensure Redis service is active
      ansible.builtin.systemd:
        name: redis-server
        state: started
        enabled: true

    - name: Verify Redis PING responsiveness
      ansible.builtin.command:
        cmd: >
          redis-cli -p {{ redis_tls_port | default(redis_port | default(6379)) }}
          {% if redis_enable_tls | default(enable_internal_tls | default(false)) | bool %}--tls --cacert {{ redis_ca_cert | default('/etc/ssl/certs/internal-ca.crt') }}{% endif %}
          {% if redis_password is defined and redis_password %} -a '{{ redis_password }}'{% endif %}
          ping
      changed_when: false
      retries: 10
      delay: 3
      register: redis_ping_res
      until: "'PONG' in redis_ping_res.stdout"
      no_log: true

    - name: Confirm Redis node is healthy and restored
      ansible.builtin.debug:
        msg: ">>> Redis node {{ inventory_hostname }} successfully updated and verified <<<"

