        update_cache: true
      register: mon_apt_cache
      retries: 3
      delay: 5
      until: mon_apt_cache is succeeded

    - name: Apply security and OS package updates (preserving configurations)
      ansible.builtin.apt:
        upgrade: dist
        dpkg_options: 'force-confdef,force-confold'

    - name: Check if kernel reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
