---
# ==============================================================================
# Playbook: Teardown / Deprovision AWS EC2 Infrastructure
# ==============================================================================

- name: Deprovision AWS EC2 Cluster Infrastructure
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars_aws.yml

  tasks:
    - name: Terminate EC2 Instances
      amazon.aws.ec2_instance:
        filters:
          "tag:Cluster": "headless-ubuntu"
        region: "{{ aws_region }}"
        state: absent
        wait: true

    - name: Get VPC Information
      amazon.aws.ec2_vpc_net_info:
        filters:
          "tag:Name": "{{ aws_vpc_name }}"
        region: "{{ aws_region }}"
      register: vpc_info

    - name: Delete VPC and Resources
      when: vpc_info.vpcs | length > 0
      block:
        - name: Delete Cluster Security Group
          amazon.aws.ec2_security_group:
            name: "{{ aws_vpc_name }}-sg"
            vpc_id: "{{ vpc_info.vpcs[0].id }}"
            region: "{{ aws_region }}"
            state: absent

        - name: Get Subnets
          amazon.aws.ec2_vpc_subnet_info:
            filters:
              vpc-id: "{{ vpc_info.vpcs[0].id }}"
            region: "{{ aws_region }}"
          register: subnets_info

        - name: Delete Subnets
          amazon.aws.ec2_vpc_subnet:
            vpc_id: "{{ vpc_info.vpcs[0].id }}"
            cidr: "{{ item.cidr_block }}"
            region: "{{ aws_region }}"
            state: absent
          loop: "{{ subnets_info.subnets }}"

        - name: Detach and Delete Internet Gateway
          amazon.aws.ec2_vpc_igw:
            vpc_id: "{{ vpc_info.vpcs[0].id }}"
            region: "{{ aws_region }}"
            state: absent

        - name: Delete VPC Network
          amazon.aws.ec2_vpc_net:
            name: "{{ aws_vpc_name }}"
            cidr_block: "{{ aws_vpc_cidr }}"
            region: "{{ aws_region }}"
            state: absent

    - name: Delete Key Pair
      amazon.aws.ec2_key:
        name: "{{ aws_key_name }}"
        region: "{{ aws_region }}"
        state: absent

    - name: Teardown Summary
      ansible.builtin.debug:
        msg: "AWS EC2 cluster resources successfully deprovisioned."
