---
# ==============================================================================
# Oracle Cloud Infrastructure (OCI) Provisioning Configuration Variables
# ==============================================================================

# OCI Compartment & Region
# Replace with your Compartment OCID from `oci iam compartment list`
oci_compartment_id: "ocid1.compartment.oc1..exampleuniqueid"
oci_region: "us-ashburn-1"

# VCN Network & Regional Subnet Configuration
oci_vcn_name: "cluster-vcn"
oci_vcn_cidr: "10.0.0.0/16"
oci_subnet_name: "cluster-subnet"
oci_subnet_cidr: "10.0.1.0/24"

# Compute Sizing & Image
oci_shape: "VM.Standard.E4.Flex"
oci_ocpus: 1
oci_memory_in_gbs: 4
oci_boot_volume_size_gb: 50

# SSH Key for Ubuntu User
oci_ssh_user: "ubuntu"
oci_ssh_pub_key_file: "~/.ssh/id_ed25519.pub"

# Cluster Node Topology & Allocation Across Fault Domains
oci_instances:
  - name: "proxy-01"
    fault_domain: "FAULT-DOMAIN-1"
    ip: "10.0.1.10"
    group: "proxies"
    nsg_role: "proxy"

  - name: "proxy-02"
    fault_domain: "FAULT-DOMAIN-2"
    ip: "10.0.1.20"
    group: "proxies"
    nsg_role: "proxy"

  - name: "proxy-03"
    fault_domain: "FAULT-DOMAIN-3"
    ip: "10.0.1.30"
    group: "proxies"
    nsg_role: "proxy"

  - name: "web-01"
    fault_domain: "FAULT-DOMAIN-1"
    ip: "10.0.1.11"
    group: "webservers"
    external_fqdn: "web1.example.com"
    nsg_role: "webserver"

  - name: "web-02"
    fault_domain: "FAULT-DOMAIN-2"
    ip: "10.0.1.21"
    group: "webservers"
    external_fqdn: "web2.example.com"
    nsg_role: "webserver"

  - name: "web-03"
    fault_domain: "FAULT-DOMAIN-3"
    ip: "10.0.1.31"
    group: "webservers"
    external_fqdn: "web3.example.com"
    nsg_role: "webserver"

  - name: "monitoring-01"
    fault_domain: "FAULT-DOMAIN-1"
    ip: "10.0.1.50"
    group: "monitoring"
    nsg_role: "monitoring"

  - name: "teleport-01"
    fault_domain: "FAULT-DOMAIN-1"
    ip: "10.0.1.60"
    group: "teleport_servers"
    nsg_role: "teleport"
