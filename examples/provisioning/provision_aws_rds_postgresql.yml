---
# ==============================================================================
# Playbook: Provision Cloud-Native AWS RDS for PostgreSQL
# ==============================================================================
# Provisions:
#   1. AWS RDS DB Subnet Group spanning multi-AZ VPC subnets
#   2. Dedicated Database Security Group allowing port 5432 from VPC CIDR
#   3. Managed Multi-AZ AWS RDS PostgreSQL instance with gp3 storage
#   4. Displays connection endpoint for use by cluster webservers
#
# Usage:
#   ansible-playbook examples/provisioning/provision_aws_rds_postgresql.yml
# ==============================================================================

- name: Provision Cloud-Native AWS RDS for PostgreSQL
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars_aws.yml

  vars:
    # RDS PostgreSQL Parameters
    aws_rds_identifier: "cluster-postgres-db"
    aws_rds_engine_version: "16.3"
    aws_rds_instance_class: "db.t4g.medium"
    aws_rds_allocated_storage_gb: 20
    aws_rds_max_allocated_storage_gb: 100
    aws_rds_db_name: "app_db"
    aws_rds_admin_user: "dbadmin"
    aws_rds_admin_password: "{{ vault_db_password }}"
    aws_rds_multi_az: true
    aws_rds_backup_retention_days: 7

  tasks:
    # --------------------------------------------------------------------------
    # 1. Discover Existing Cluster VPC & Subnets
    # --------------------------------------------------------------------------
    - name: Discover Cluster VPC
      amazon.aws.ec2_vpc_net_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Name": "{{ aws_vpc_name }}"
      register: vpc_info

    - name: Assert VPC Exists
      ansible.builtin.assert:
        that:
          - vpc_info.vpcs | length > 0
        fail_msg: "VPC {{ aws_vpc_name }} not found. Run provision_aws.yml first."

    - name: Set VPC ID Fact
      ansible.builtin.set_fact:
        cluster_vpc_id: "{{ vpc_info.vpcs[0].vpc_id }}"

    - name: Discover VPC Subnets
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ aws_region }}"
        filters:
          vpc-id: "{{ cluster_vpc_id }}"
      register: subnet_info

    - name: Extract Subnet IDs
      ansible.builtin.set_fact:
        cluster_subnet_ids: "{{ subnet_info.subnets | map(attribute='subnet_id') | list }}"

    # --------------------------------------------------------------------------
    # 2. Database Subnet Group & Security Group
    # --------------------------------------------------------------------------
    - name: Create RDS DB Subnet Group across Multi-AZ Subnets
      amazon.aws.rds_subnet_group:
        name: "cluster-db-subnet-group"
        description: "Subnet group for cluster RDS PostgreSQL across AZs"
        subnets: "{{ cluster_subnet_ids }}"
        region: "{{ aws_region }}"
        state: present

    - name: Create RDS Database Security Group
      amazon.aws.ec2_security_group:
        name: "cluster-rds-sg"
        description: "Allow PostgreSQL port 5432 from cluster VPC private subnets"
        vpc_id: "{{ cluster_vpc_id }}"
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            ports: [5432]
            cidr_ip: "{{ aws_vpc_cidr }}"
            rule_desc: "PostgreSQL from cluster VPC"
        rules_egress:
          - proto: all
            cidr_ip: "0.0.0.0/0"
            rule_desc: "Allow outbound traffic"
        state: present
      register: rds_sg

    # --------------------------------------------------------------------------
    # 3. Provision AWS RDS PostgreSQL Instance
    # --------------------------------------------------------------------------
    - name: Provision Multi-AZ AWS RDS PostgreSQL Instance
      amazon.aws.rds_instance:
        id: "{{ aws_rds_identifier }}"
        engine: postgres
        engine_version: "{{ aws_rds_engine_version }}"
        db_instance_class: "{{ aws_rds_instance_class }}"
        allocated_storage: "{{ aws_rds_allocated_storage_gb }}"
        max_allocated_storage: "{{ aws_rds_max_allocated_storage_gb }}"
        storage_type: gp3
        storage_encrypted: true
        db_name: "{{ aws_rds_db_name }}"
        username: "{{ aws_rds_admin_user }}"
        password: "{{ aws_rds_admin_password }}"
        multi_az: "{{ aws_rds_multi_az }}"
        db_subnet_group_name: "cluster-db-subnet-group"
        vpc_security_group_ids: ["{{ rds_sg.group_id }}"]
        backup_retention_period: "{{ aws_rds_backup_retention_days }}"
        publicly_accessible: false
        auto_minor_version_upgrade: true
        region: "{{ aws_region }}"
        tags:
          Name: "{{ aws_rds_identifier }}"
          Cluster: "headless-ubuntu"
          Engine: "postgresql"
        state: present
        wait: true
      register: rds_instance

    # --------------------------------------------------------------------------
    # 4. Connection Details & Inventory Guidance
    # --------------------------------------------------------------------------
    - name: Display Cloud-Native RDS Endpoint Summary
      ansible.builtin.debug:
        msg:
          - "================================================================="
          - "Cloud-Native AWS RDS PostgreSQL Instance Provisioned Successfully!"
          - "Endpoint Host:    {{ rds_instance.endpoint.address }}"
          - "Port:             {{ rds_instance.endpoint.port }}"
          - "Database Name:    {{ aws_rds_db_name }}"
          - "Master Username:  {{ aws_rds_admin_user }}"
          - "Multi-AZ Active:  {{ aws_rds_multi_az }}"
          - "================================================================="
          - "Add the following to your inventory or group_vars/webservers.yml:"
          - "  db_host: {{ rds_instance.endpoint.address }}"
          - "  db_port: {{ rds_instance.endpoint.port }}"
          - "  db_name: {{ aws_rds_db_name }}"
          - "  db_user: {{ aws_rds_admin_user }}"
          - "  db_engine: postgresql"
          - "================================================================="
