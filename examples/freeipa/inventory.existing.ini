# ==============================================================================
# FreeIPA Existing Instance Connection Inventory
# Scenario: Enrolling cluster nodes into a pre-existing enterprise FreeIPA / Red Hat IdM domain.
# ==============================================================================

[proxies]
proxy-01 ansible_host=10.0.1.10
proxy-02 ansible_host=10.0.1.20
proxy-03 ansible_host=10.0.1.30

[webservers]
web-01 ansible_host=10.0.1.11 external_fqdn=web1.example.com
web-02 ansible_host=10.0.1.12 external_fqdn=web2.example.com
web-03 ansible_host=10.0.1.13 external_fqdn=web3.example.com

[monitoring]
monitoring-01 ansible_host=10.0.1.50

[teleport_servers]
# Teleport is disabled when identity_provider=freeipa

[freeipa_servers]
# External FreeIPA instance; no local server provisioning needed

# Note: No local [freeipa_servers] group is defined since the server is externally managed.
[headless_nodes:children]
proxies
webservers
monitoring

[headless_nodes:vars]
ansible_user=ubuntu
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
domain_name=example.com

# Identity Provider Selection: FreeIPA (Existing External Instance)
identity_provider=freeipa
freeipa_deploy_server=false

# External FreeIPA Server Details
freeipa_server_host=192.168.1.100
freeipa_server_fqdn=idm.corp.example.com
freeipa_domain=corp.example.com
freeipa_realm=CORP.EXAMPLE.COM

# Enrollment Method: One-Time Password (OTP) or Admin Credentials
# Generate an OTP per host or bulk enrollment token on the FreeIPA server:
#   ipa host-add <fqdn> --password=<otp>
# Set freeipa_client_otp via Ansible Vault in group_vars or pass at runtime:
# freeipa_client_otp=SecretOneTimeHostPassword2026!
