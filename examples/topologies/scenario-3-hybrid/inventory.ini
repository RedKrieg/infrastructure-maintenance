# ==============================================================================
# Scenario 3: Hybrid Topology (Pooled HA Site + Dedicated Tenant Webservers)
# ==============================================================================
# In this topology, both models coexist harmoniously within the same cluster:
#   1. Clustered High-Availability Core App:
#      web-pool-01 and web-pool-02 both serve app.example.com under a shared pool.
#   2. Isolated Dedicated Tenants:
#      web-tenant-a serves tenant-a.example.com (1:1 dedicated).
#      web-tenant-b serves tenant-b.example.com (1:1 dedicated).
#
# HAProxy automatically creates:
#   - be_app_example_com containing web-pool-01 & web-pool-02 (Round-Robin)
#   - be_tenant_a_example_com containing web-tenant-a (1:1)
#   - be_tenant_b_example_com containing web-tenant-b (1:1)
# ==============================================================================

[proxies]
proxy-01 ansible_host=192.168.10.11 internal_ip=192.168.10.11
proxy-02 ansible_host=192.168.10.12 internal_ip=192.168.10.12

[webservers]
# Clustered HA Pool for Core Web App
web-pool-01  ansible_host=192.168.10.21 external_fqdn=app.example.com internal_ip=192.168.10.21
web-pool-02  ansible_host=192.168.10.22 external_fqdn=app.example.com internal_ip=192.168.10.22

# Dedicated 1:1 Tenant Backends
web-tenant-a ansible_host=192.168.10.23 external_fqdn=tenant-a.example.com internal_ip=192.168.10.23
web-tenant-b ansible_host=192.168.10.24 external_fqdn=tenant-b.example.com internal_ip=192.168.10.24

[monitoring]
mon-01     ansible_host=192.168.10.31 monitoring_fqdn=mon.example.com grafana_fqdn=grafana.example.com internal_ip=192.168.10.31

[teleport_servers]
teleport-01 ansible_host=192.168.10.41 external_fqdn=teleport.example.com internal_ip=192.168.10.41

[freeipa_servers]

[databases]
# Hybrid Database Node: Serves both the clustered core site and dedicated tenants
db-01 ansible_host=192.168.10.51 internal_ip=192.168.10.51 db_engine=postgresql

[databases:vars]
# Mixed database provisioning: Central core app db + individual tenant databases
db_databases=[{"name":"app_db","user":"app_user","password":"CoreAppSecret2026!"},{"name":"tenant_a_db","user":"tenant_a_user","password":"TenantASecret2026!"},{"name":"tenant_b_db","user":"tenant_b_user","password":"TenantBSecret2026!"}]

[headless_nodes:children]
proxies
webservers
monitoring
teleport_servers
freeipa_servers
databases

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/cluster_ed25519
ansible_python_interpreter=/usr/bin/python3
domain_name=example.com

# Keepalived Floating VIP across proxies
keepalived_vip_cidr=192.168.10.100/24
keepalived_interface=eth0

# Internal Zero-Trust TLS (ECDSA P-384)
haproxy_backend_ssl=true
webserver_enable_ssl=true
haproxy_backend_ssl_verify=required
