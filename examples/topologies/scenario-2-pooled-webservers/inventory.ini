# ==============================================================================
# Scenario 2: Pooled N:1 Load-Balanced Webservers (Single Site / Clustered)
# ==============================================================================
# In this topology, multiple webservers collaborate to host the exact same
# application under a shared external_fqdn (app.example.com).
# HAProxy automatically detects the identical external_fqdn and groups all
# matching webservers into a single backend pool (be_app_example_com),
# load-balancing client traffic across all active nodes using round-robin.
#
# Characteristics:
#   - Traffic Routing: N:1 load balancing across web-01, web-02, web-03
#   - State Management: Requires stateless application design (Redis for sessions,
#     shared object storage / NFS for uploads, centralized DB cluster)
#   - High Availability: Active-Active redundancy across all webservers. If any
#     webserver crashes or reboots, HAProxy instantly routes traffic to surviving nodes
#   - Rolling Maintenance: True zero-downtime rolling upgrades. Each node is drained
#     and rebooted serially while remaining pool members handle 100% of user traffic
# ==============================================================================

[proxies]
proxy-01 ansible_host=192.168.10.11 internal_ip=192.168.10.11
proxy-02 ansible_host=192.168.10.12 internal_ip=192.168.10.12

[webservers]
# Pool Member 1
web-01  ansible_host=192.168.10.21 external_fqdn=app.example.com internal_ip=192.168.10.21
# Pool Member 2
web-02  ansible_host=192.168.10.22 external_fqdn=app.example.com internal_ip=192.168.10.22
# Pool Member 3
web-03  ansible_host=192.168.10.23 external_fqdn=app.example.com internal_ip=192.168.10.23

[monitoring]
mon-01     ansible_host=192.168.10.31 monitoring_fqdn=mon.example.com grafana_fqdn=grafana.example.com internal_ip=192.168.10.31

[teleport_servers]
teleport-01 ansible_host=192.168.10.41 external_fqdn=teleport.example.com internal_ip=192.168.10.41

[freeipa_servers]

[databases]
# Primary Write Master with PgBouncer connection pooling on port 6432
db-primary   ansible_host=192.168.10.51 internal_ip=192.168.10.51 db_role=primary enable_pgbouncer=true db_engine=postgresql
# Streaming Read Replica for offloading read-heavy queries & reports
db-replica-1 ansible_host=192.168.10.52 internal_ip=192.168.10.52 db_role=replica db_engine=postgresql

[databases:vars]
# Central application database shared across all pooled webservers
db_name=app_db
db_user=app_user
db_password=AppDBSecret2026!
db_replication_user=replicator
db_replication_password=ReplSecret2026!

# PgBouncer Connection Pooling (Port 6432)
pgbouncer_port=6432
pgbouncer_pool_mode=transaction

# Note: In cloud-native deployments, db_host points directly to AWS RDS Multi-AZ,
# GCP Cloud SQL High Availability, or Azure Flexible Server endpoints.

[headless_nodes:children]
proxies
webservers
monitoring
teleport_servers
freeipa_servers
databases

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/cluster_ed25519
ansible_python_interpreter=/usr/bin/python3
domain_name=example.com

# Keepalived Floating VIP across proxies
keepalived_vip_cidr=192.168.10.100/24
keepalived_interface=eth0

# Backend Load Balancing Algorithm ('roundrobin', 'leastconn', 'source')
haproxy_balance_algorithm=roundrobin

# Session Persistence (Optional: set to true to insert SERVERID cookie)
haproxy_enable_cookie_persistence=false

# Internal Zero-Trust TLS (ECDSA P-384)
haproxy_backend_ssl=true
webserver_enable_ssl=true
haproxy_backend_ssl_verify=required
