# ==============================================================================
# Scenario 1: Dedicated 1:1 Webserver Backends (Unique Clients / Multi-Tenant)
# ==============================================================================
# In this topology, each webserver hosts a dedicated application for a distinct
# client or tenant. Each webserver is assigned a unique external_fqdn.
# HAProxy creates isolated 1:1 backends routing client traffic directly to their
# respective node.
#
# Characteristics:
#   - Traffic Routing: 1:1 mapping (client1.example.com -> web-tenant-1)
#   - State Management: Local stateful storage (local uploads, local sessions) is safe
#   - High Availability: Proxy layer has active-passive Keepalived VRRP failover;
#     backend webserver failover relies on backup node promotion or hypervisor HA
#   - Rolling Maintenance: Maintenance drains traffic for that specific tenant;
#     maintenance windows should be scheduled per tenant
# ==============================================================================

[proxies]
proxy-01 ansible_host=192.168.10.11 internal_ip=192.168.10.11
proxy-02 ansible_host=192.168.10.12 internal_ip=192.168.10.12

[webservers]
# Dedicated backend for Client Alpha
web-alpha  ansible_host=192.168.10.21 external_fqdn=alpha.example.com  internal_ip=192.168.10.21
# Dedicated backend for Client Beta
web-beta   ansible_host=192.168.10.22 external_fqdn=beta.example.com   internal_ip=192.168.10.22
# Dedicated backend for Client Gamma
web-gamma  ansible_host=192.168.10.23 external_fqdn=gamma.example.com  internal_ip=192.168.10.23

[monitoring]
mon-01     ansible_host=192.168.10.31 monitoring_fqdn=mon.example.com grafana_fqdn=grafana.example.com internal_ip=192.168.10.31

[teleport_servers]
teleport-01 ansible_host=192.168.10.41 external_fqdn=teleport.example.com internal_ip=192.168.10.41

[freeipa_servers]

[databases]
# Optional Database Layer: Multi-tenant PostgreSQL (preferred) or MySQL instance
# Hosts isolated databases and credentials for each distinct client tenant
db-01 ansible_host=192.168.10.51 internal_ip=192.168.10.51 db_engine=postgresql

[databases:vars]
# Per-tenant isolated databases, service users, and credentials
db_databases=[{"name":"alpha_db","user":"alpha_user","password":"AlphaDBSecret2026!"},{"name":"beta_db","user":"beta_user","password":"BetaDBSecret2026!"},{"name":"gamma_db","user":"gamma_user","password":"GammaDBSecret2026!"}]

[redis_servers]
# Optional Redis cache & session store
redis-01 ansible_host=192.168.10.61 internal_ip=192.168.10.61

[rabbitmq_servers]
# Optional RabbitMQ message broker for asynchronous client background tasks
mq-01 ansible_host=192.168.10.71 internal_ip=192.168.10.71 rabbitmq_mgmt_fqdn=mq.example.com

[headless_nodes:children]
proxies
webservers
monitoring
teleport_servers
freeipa_servers
databases
redis_servers
rabbitmq_servers

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/cluster_ed25519
ansible_python_interpreter=/usr/bin/python3
domain_name=example.com

# Keepalived Floating VIP across proxies
keepalived_vip_cidr=192.168.10.100/24
keepalived_interface=eth0

# Internal Zero-Trust TLS (ECDSA P-384)
haproxy_backend_ssl=true
webserver_enable_ssl=true
haproxy_backend_ssl_verify=required
