# ==============================================================================
# Prometheus Alertmanager - Slack Notification Configuration Example
# ==============================================================================
# Place or adapt this into /etc/prometheus/alertmanager.yml or your inventory
# group_vars to route cluster alerts directly to a Slack channel.
#
# Prerequisite: Create an Incoming Webhook in your Slack Workspace
# (e.g., https://hooks.slack.com/services/T000/B000/XXXXX)
# ==============================================================================

global:
  resolve_timeout: 5m
  slack_api_url: 'https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'slack-notifications'
  routes:
    - match:
        alertname: 'TeleportSudoAccessRequestPending'
      group_by: ['alertname', 'request_id']
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 15m
      receiver: 'slack-notifications'

receivers:
  - name: 'slack-notifications'
    slack_configs:
      - channel: '#cluster-alerts'
        send_resolved: true
        icon_emoji: ':fire_engine:'
        title: |-
          [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.cluster }})
        title_link: '{{ (index .Alerts 0).GeneratorURL }}'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Severity:* `{{ .Labels.severity }}`
            *Instance:* `{{ .Labels.instance }}`
            {{ if .Annotations.approval_url }}*Approve / Review:* <{{ .Annotations.approval_url }}|Open in Teleport Web UI>{{ end }}
            *Started:* {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
          {{ end }}
