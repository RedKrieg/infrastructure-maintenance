# ==============================================================================
# Prometheus Alertmanager - Discord Notification Configuration Example
# ==============================================================================
# Discord provides native Slack-compatible webhook parsing when you append '/slack'
# to your Discord webhook URL. This allows Alertmanager to communicate directly with
# Discord channels using the native slack_configs block without third-party proxies.
#
# Prerequisite: In Discord Channel Settings -> Integrations -> Webhooks, copy URL
# Example URL: https://discord.com/api/webhooks/1234567890/TOKEN
# Append /slack: https://discord.com/api/webhooks/1234567890/TOKEN/slack
# ==============================================================================

global:
  resolve_timeout: 5m
  slack_api_url: 'https://discord.com/api/webhooks/123456789012345678/XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX/slack'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'discord-notifications'
  routes:
    - match:
        alertname: 'TeleportSudoAccessRequestPending'
      group_by: ['alertname', 'request_id']
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 15m
      receiver: 'discord-notifications'

receivers:
  - name: 'discord-notifications'
    slack_configs:
      - channel: '#cluster-ops'
        send_resolved: true
        title: |-
          [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} (Cluster: {{ .CommonLabels.cluster }})
        title_link: '{{ (index .Alerts 0).GeneratorURL }}'
        text: >-
          {{ range .Alerts }}
            **Alert:** {{ .Annotations.summary }}
            **Description:** {{ .Annotations.description }}
            **Severity:** `{{ .Labels.severity }}`
            **Host:** `{{ .Labels.instance }}`
            {{ if .Annotations.approval_url }}**Approve / Review:** <{{ .Annotations.approval_url }}|Open in Teleport Web UI>{{ end }}
            **Timestamp:** {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
          {{ end }}
