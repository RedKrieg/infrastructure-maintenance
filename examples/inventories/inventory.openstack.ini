# ==============================================================================
# OpenStack Example Inventory
# Frontends deployed in a Nova server group (anti-affinity) across hypervisors
# Behind an OpenStack Octavia Load Balancer (TCP Amphora) or Keepalived VIP
# ==============================================================================

[proxies]
# Nova instances distributed across tenant private subnet (192.168.100.0/24)
proxy-01 ansible_host=192.168.100.10
proxy-02 ansible_host=192.168.100.20
proxy-03 ansible_host=192.168.100.30

[webservers]
# Backend webservers - only external_fqdn is required per target
web-01 ansible_host=192.168.100.11 external_fqdn=web1.example.com
web-02 ansible_host=192.168.100.12 external_fqdn=web2.example.com
web-03 ansible_host=192.168.100.13 external_fqdn=web3.example.com

[monitoring]
# Prometheus monitoring server instance
monitoring-01 ansible_host=192.168.100.50

[teleport_servers]
# Teleport Auth & Proxy server
teleport-01 ansible_host=192.168.100.60

[freeipa_servers]
# Optional: Dedicated FreeIPA server host when using identity_provider=freeipa

[databases]
# Optional Database Layer: OpenStack Nova VM or OpenStack Trove database service
# db-01 ansible_host=192.168.100.40 db_engine=postgresql

[redis_servers]
# Optional In-Memory Cache & Session Store
# redis-01 ansible_host=192.168.100.45

[rabbitmq_servers]
# Optional Message Broker & Task Queue
# mq-01 ansible_host=192.168.100.46

[headless_nodes:children]
proxies
webservers
monitoring
teleport_servers
freeipa_servers
databases
redis_servers
rabbitmq_servers

[headless_nodes:vars]
# Standard username for Ubuntu cloud images deployed via OpenStack Glance
ansible_user=ubuntu
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
