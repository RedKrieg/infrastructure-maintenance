# ==============================================================================
# Oracle Cloud Infrastructure (OCI) Example Inventory
# Frontends placed across distinct Fault Domains (e.g., FD-1, FD-2, FD-3)
# Behind an OCI Network Load Balancer (NLB) with TCP 80/443 listeners
# ==============================================================================

[proxies]
# Compute instances distributed across fault domains in the VCN (10.0.0.0/16)
proxy-01 ansible_host=10.0.1.10 fault_domain=FAULT-DOMAIN-1
proxy-02 ansible_host=10.0.1.20 fault_domain=FAULT-DOMAIN-2
proxy-03 ansible_host=10.0.1.30 fault_domain=FAULT-DOMAIN-3

[webservers]
# Backend webservers - only external_fqdn is required per target
web-01 ansible_host=10.0.1.11 external_fqdn=web1.example.com fault_domain=FAULT-DOMAIN-1
web-02 ansible_host=10.0.1.21 external_fqdn=web2.example.com fault_domain=FAULT-DOMAIN-2
web-03 ansible_host=10.0.1.31 external_fqdn=web3.example.com fault_domain=FAULT-DOMAIN-3

[monitoring]
# Prometheus monitoring server instance
monitoring-01 ansible_host=10.0.1.50 fault_domain=FAULT-DOMAIN-1

[teleport_servers]
# Teleport Auth & Proxy server
teleport-01 ansible_host=10.0.1.60 fault_domain=FAULT-DOMAIN-1

[freeipa_servers]
# Optional: Dedicated FreeIPA server host when using identity_provider=freeipa

[headless_nodes:children]
proxies
webservers
monitoring
teleport_servers
freeipa_servers

[headless_nodes:vars]
# Standard username for official Canonical Ubuntu images on Oracle Cloud Infrastructure
ansible_user=ubuntu
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
