# ==============================================================================
# Google Cloud Platform (GCP) Compute Engine Example Inventory
# Frontends placed across distinct GCP Zones (e.g., us-central1-a, 1-b, 1-c)
# Behind a Regional External TCP/UDP Passthrough Network Load Balancer
# ==============================================================================

[proxies]
# Compute Engine instances across distinct zones in the VPC (10.128.0.0/20)
proxy-01 ansible_host=10.128.0.10 zone=us-central1-a
proxy-02 ansible_host=10.128.0.20 zone=us-central1-b
proxy-03 ansible_host=10.128.0.30 zone=us-central1-c

[webservers]
# Backend webservers - only external_fqdn is required per target
web-01 ansible_host=10.128.0.11 external_fqdn=web1.example.com zone=us-central1-a
web-02 ansible_host=10.128.0.21 external_fqdn=web2.example.com zone=us-central1-b
web-03 ansible_host=10.128.0.31 external_fqdn=web3.example.com zone=us-central1-c

[monitoring]
# Prometheus monitoring server instance
monitoring-01 ansible_host=10.128.0.50 zone=us-central1-a

[teleport_servers]
# Teleport Auth & Proxy server
teleport-01 ansible_host=10.128.0.60 zone=us-central1-a

[headless_nodes:children]
proxies
webservers
monitoring
teleport_servers

[headless_nodes:vars]
# Standard username for Ubuntu images on Google Compute Engine
ansible_user=ubuntu
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
