# ==============================================================================
# Google Cloud Platform (GCP) Dynamic Inventory Configuration
# Plugin: google.cloud.gcp_compute
# Discovers Compute Engine instances in the project matching cluster tags
# ==============================================================================
plugin: google.cloud.gcp_compute
projects:
  - your-gcp-project-id
zones:
  - us-central1-a
  - us-central1-b
  - us-central1-c

filters:
  - status = RUNNING

keyed_groups:
  - key: tags['items']
    prefix: ""
    separator: ""

compose:
  ansible_host: networkInterfaces[0].networkIP
  ansible_user: "'ubuntu'"
  external_fqdn: metadata.external_fqdn | default(omit)

groups:
  headless_nodes: "true"
