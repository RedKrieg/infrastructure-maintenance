# ==============================================================================
# AWS EC2 Example Inventory
# Frontends placed across distinct Availability Zones (e.g., us-east-1a, 1b, 1c)
# Behind an AWS Network Load Balancer (NLB) with TCP Cross-Zone routing
# ==============================================================================

[proxies]
# EC2 instances distributed across separate AZs in the VPC (172.31.0.0/16)
proxy-01 ansible_host=172.31.10.10 az=us-east-1a
proxy-02 ansible_host=172.31.20.10 az=us-east-1b
proxy-03 ansible_host=172.31.30.10 az=us-east-1c

[webservers]
# Backend webservers - only external_fqdn is required per target
web-01 ansible_host=172.31.10.11 external_fqdn=web1.example.com az=us-east-1a
web-02 ansible_host=172.31.20.11 external_fqdn=web2.example.com az=us-east-1b
web-03 ansible_host=172.31.30.11 external_fqdn=web3.example.com az=us-east-1c

[monitoring]
# Prometheus monitoring server instance
monitoring-01 ansible_host=172.31.10.50 az=us-east-1a

[teleport_servers]
# Teleport Auth & Proxy server
teleport-01 ansible_host=172.31.10.60 az=us-east-1a

[freeipa_servers]
# Optional: Dedicated FreeIPA server host when using identity_provider=freeipa

[databases]
# Option A: Self-hosted PostgreSQL EC2 instance (within VPC private subnet)
# db-01 ansible_host=172.31.10.40 az=us-east-1a db_engine=postgresql
#
# Option B (Recommended): Cloud-Native AWS RDS for PostgreSQL
# See provision_aws_rds_postgresql.yml. Webservers connect directly to:
# db_host=cluster-postgres-db.c12345678901.us-east-1.rds.amazonaws.com
# db_port=5432
# db_engine=postgresql

[headless_nodes:children]
proxies
webservers
monitoring
teleport_servers
freeipa_servers
databases

[headless_nodes:vars]
# Standard username for official Canonical Ubuntu AMIs on AWS EC2
ansible_user=ubuntu
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
