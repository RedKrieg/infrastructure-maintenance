# ==============================================================================
# Cloud-Agnostic Inventory with Dedicated FreeIPA Server (Alternative to Teleport)
# ==============================================================================

[proxies]
proxy-01 ansible_host=10.0.1.10
proxy-02 ansible_host=10.0.1.20
proxy-03 ansible_host=10.0.1.30

[webservers]
web-01 ansible_host=10.0.1.11 external_fqdn=web1.example.com
web-02 ansible_host=10.0.1.12 external_fqdn=web2.example.com
web-03 ansible_host=10.0.1.13 external_fqdn=web3.example.com

[monitoring]
monitoring-01 ansible_host=10.0.1.50

[teleport_servers]
# Teleport is disabled when identity_provider=freeipa

[freeipa_servers]
# Dedicated FreeIPA Centralized Identity Server
ipa-01 ansible_host=10.0.1.70 external_fqdn=ipa.example.com

[databases]
# Optional: Self-hosted PostgreSQL or MySQL server enrolled in FreeIPA Kerberos/LDAP
# db-01 ansible_host=10.0.1.40 db_engine=postgresql

[headless_nodes:children]
proxies
webservers
monitoring
freeipa_servers
databases

[headless_nodes:vars]
ansible_user=ubuntu
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
domain_name=example.com

# Identity Provider: FreeIPA
identity_provider=freeipa
freeipa_deploy_server=true
freeipa_server_fqdn=ipa.example.com
freeipa_domain=example.com
freeipa_realm=EXAMPLE.COM
