# ==============================================================================
# Microsoft Azure Example Inventory
# Frontends placed across distinct Availability Zones (e.g., 1, 2, 3)
# Behind an Azure Standard Load Balancer with TCP 80/443 load balancing rules
# ==============================================================================

[proxies]
# Azure VMs distributed across availability zones in the VNet (10.240.0.0/16)
proxy-01 ansible_host=10.240.1.10 zone=1
proxy-02 ansible_host=10.240.1.20 zone=2
proxy-03 ansible_host=10.240.1.30 zone=3

[webservers]
# Backend webservers - only external_fqdn is required per target
web-01 ansible_host=10.240.1.11 external_fqdn=web1.example.com zone=1
web-02 ansible_host=10.240.1.21 external_fqdn=web2.example.com zone=2
web-03 ansible_host=10.240.1.31 external_fqdn=web3.example.com zone=3

[monitoring]
# Prometheus monitoring server instance
monitoring-01 ansible_host=10.240.1.50 zone=1

[teleport_servers]
# Teleport Auth & Proxy server
teleport-01 ansible_host=10.240.1.60 zone=1

[freeipa_servers]
# Optional: Dedicated FreeIPA server host when using identity_provider=freeipa

[databases]
# Option A: Self-hosted PostgreSQL Azure VM
# db-01 ansible_host=10.240.1.40 zone=1 db_engine=postgresql
#
# Option B (Recommended): Cloud-Native Azure Database for PostgreSQL Flexible Server
# See provision_azure_postgresql.yml. Webservers connect directly to:
# db_host=cluster-postgres-flex.postgres.database.azure.com
# db_port=5432
# db_engine=postgresql

[redis_servers]
# Option A: Self-hosted Redis on Azure VM
# redis-01 ansible_host=10.240.1.45 zone=1
# Option B (Cloud-Native): Azure Cache for Redis (see provision_azure_cache_redis.yml)

[rabbitmq_servers]
# Option A: Self-hosted RabbitMQ on Azure VM
# mq-01 ansible_host=10.240.1.46 zone=1

[headless_nodes:children]
proxies
webservers
monitoring
teleport_servers
freeipa_servers
databases
redis_servers
rabbitmq_servers

[headless_nodes:vars]
# Standard username for Ubuntu Linux virtual machines on Microsoft Azure
ansible_user=ubuntu
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
