# ==============================================================================
# Cloud & Backend Agnostic Headless Cluster Inventory
# Works out of the box on AWS EC2, GCP Compute Engine, OpenStack, or Bare Metal.
# Each webserver defines its unique externally accessible FQDN.
# The proxy role dynamically maps these FQDNs to backend targets and handles SSL.
# ==============================================================================

[proxies]
proxy-01 ansible_host=10.0.1.10
proxy-02 ansible_host=10.0.1.20
proxy-03 ansible_host=10.0.1.30

[webservers]
web-01 ansible_host=10.0.1.11 external_fqdn=web1.example.com
web-02 ansible_host=10.0.1.12 external_fqdn=web2.example.com
web-03 ansible_host=10.0.1.13 external_fqdn=web3.example.com

[monitoring]
monitoring-01 ansible_host=10.0.1.50

[teleport_servers]
teleport-01 ansible_host=10.0.1.60

[freeipa_servers]
# Optional: Dedicated FreeIPA server host when using identity_provider=freeipa
# ipa-01 ansible_host=10.0.1.70

[databases]
# Optional: Dedicated PostgreSQL (preferred) or MySQL database node
# db-01 ansible_host=10.0.1.40 internal_ip=10.0.1.40 db_engine=postgresql

[headless_nodes:children]
proxies
webservers
monitoring
teleport_servers
freeipa_servers
databases

[headless_nodes:vars]
# User with which Ansible connects (must have passwordless sudo on targets)
ansible_user=ubuntu
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
