# ==============================================================================
# Headless Cluster Inventory - 10.0.0.0/8 Subnet Example
# ==============================================================================

[proxies]
proxy-01 ansible_host=10.0.1.10
proxy-02 ansible_host=10.0.1.20

[webservers]
web-01 ansible_host=10.0.1.11
web-02 ansible_host=10.0.1.12
web-03 ansible_host=10.0.1.13

[headless_nodes:children]
proxies
webservers

[headless_nodes:vars]
# User with which Ansible connects (must have passwordless sudo on targets)
ansible_user=ubuntu
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
