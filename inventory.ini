# Example inventory for new headless Ubuntu systems
# Replace IP / hostnames and connection user (e.g. ubuntu, debian, root, or cloud-user)

[headless_nodes]
# node1.example.com ansible_host=192.168.1.50 ansible_user=ubuntu
# node2.example.com ansible_host=192.168.1.51 ansible_user=ubuntu

[headless_nodes:vars]
# User with which Ansible connects (must have passwordless sudo on the remote system)
ansible_user=ubuntu
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
