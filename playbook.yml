---
# ==============================================================================
# Playbook: Headless Ubuntu Provisioning, Proxies & Webservers
# ==============================================================================

# ------------------------------------------------------------------------------
# Play 1: Base System, Security & User Provisioning for ALL Nodes
# ------------------------------------------------------------------------------
- name: Provision Core Systems, Security & Admin Users
  hosts: all
  become: true
  gather_facts: true

  vars_files:
    - vars/admin_users.yml

  roles:
    - role: system_base
      tags: [system_base, system, packages, tuning]

    - role: security
      tags: [security, ufw, firewall, ssh, sshd]

    - role: admin_users
      tags: [admin_users, users, dotfiles, venv]

    - role: node_exporter
      tags: [node_exporter, monitoring, telemetry]

# ------------------------------------------------------------------------------
# Play 2: Proxy Ingress Foundation & Cluster Internal CA Authority
# ------------------------------------------------------------------------------
- name: Provision Proxy Ingress Foundation & Internal CA Authority
  hosts: proxies
  become: true
  gather_facts: true

  vars_files:
    - vars/admin_users.yml

  roles:
    - role: proxy
      vars:
        proxy_stage: "ca_foundation"
      tags: [proxy, haproxy, ssl, acme, certs, firewall, internal_ca]

# ------------------------------------------------------------------------------
# Play 3: Optional Database Layer (PostgreSQL or MySQL)
# ------------------------------------------------------------------------------
- name: Provision Database Layer (PostgreSQL or MySQL)
  hosts: databases
  become: true
  gather_facts: true

  vars_files:
    - vars/admin_users.yml

  roles:
    - role: database
      when:
        - enable_database | default(true) | bool
        - groups['databases'] is defined and groups['databases'] | length > 0
      tags: [database, db, postgresql, mysql, sql]

# ------------------------------------------------------------------------------
# Play 4: Optional In-Memory Cache & Session Store (Redis)
# ------------------------------------------------------------------------------
- name: Provision In-Memory Cache & Session Store (Redis)
  hosts: redis_servers
  become: true
  gather_facts: true

  vars_files:
    - vars/admin_users.yml

  roles:
    - role: redis
      when:
        - enable_redis | default(true) | bool
        - groups['redis_servers'] is defined and groups['redis_servers'] | length > 0
      tags: [redis, cache, session]

# ------------------------------------------------------------------------------
# Play 5: Optional Message Broker & Task Queue (RabbitMQ)
# ------------------------------------------------------------------------------
- name: Provision Message Broker & Task Queue (RabbitMQ)
  hosts: rabbitmq_servers
  become: true
  gather_facts: true

  vars_files:
    - vars/admin_users.yml

  roles:
    - role: rabbitmq
      when:
        - enable_rabbitmq | default(true) | bool
        - groups['rabbitmq_servers'] is defined and groups['rabbitmq_servers'] | length > 0
      tags: [rabbitmq, queue, amqp, broker]

# ------------------------------------------------------------------------------
# Play 6: Backend Webservers (Nginx, Zero-Trust TLS, Default 404 Catch-All)
# ------------------------------------------------------------------------------
- name: Provision Backend Webservers
  hosts: webservers
  become: true
  gather_facts: true

  roles:
    - role: webserver
      tags: [webserver, nginx, sites, firewall, ssl, tls]

# ------------------------------------------------------------------------------
# Play 7: Finalize HAProxy Load Balancers & Keepalived VRRP Routing
# ------------------------------------------------------------------------------
- name: Finalize HAProxy Ingress Routing & High Availability
  hosts: proxies
  become: true
  gather_facts: true

  vars_files:
    - vars/admin_users.yml

  roles:
    - role: proxy
      vars:
        proxy_stage: "routing"
      tags: [proxy, haproxy, routing]

    - role: keepalived
      tags: [keepalived, ha, vrrp]

# ------------------------------------------------------------------------------
# Play 8: Prometheus Monitoring Server
# ------------------------------------------------------------------------------
- name: Provision Prometheus Monitoring Server
  hosts: monitoring
  become: true
  gather_facts: true

  vars_files:
    - vars/admin_users.yml

  roles:
    - role: prometheus_server
      tags: [monitoring, prometheus, firewall]

    - role: grafana
      tags: [grafana, monitoring, telemetry, dashboards]

# ------------------------------------------------------------------------------
# Play 9: Centralized Identity & Access Management (Teleport or FreeIPA Server)
# ------------------------------------------------------------------------------
- name: Provision Teleport Auth & Proxy Server
  hosts: teleport_servers
  become: true
  gather_facts: true
  vars_files:
    - vars/admin_users.yml

  roles:
    - role: teleport_server
      when: identity_provider | default('teleport') in ['teleport', 'both']
      tags: [teleport, teleport_server, auth, rbac]

- name: Provision FreeIPA Centralized Identity Server
  hosts: freeipa_servers
  become: true
  gather_facts: true
  vars_files:
    - vars/admin_users.yml

  roles:
    - role: freeipa_server
      when:
        - identity_provider | default('teleport') in ['freeipa', 'both']
        - freeipa_deploy_server | default(true) | bool
      tags: [freeipa, freeipa_server, identity, auth]

# ------------------------------------------------------------------------------
# Play 10: Identity Client Integration across Cluster Nodes (Teleport or FreeIPA)
# ------------------------------------------------------------------------------
- name: Provision Teleport Node Service on Cluster Nodes
  hosts: headless_nodes
  become: true
  gather_facts: true

  roles:
    - role: teleport_node
      when: identity_provider | default('teleport') in ['teleport', 'both']
      tags: [teleport, teleport_node, ssh]

- name: Provision FreeIPA Client Enrollment across Cluster Nodes
  hosts: headless_nodes
  become: true
  gather_facts: true

  roles:
    - role: freeipa_client
      when: identity_provider | default('teleport') in ['freeipa', 'both']
      tags: [freeipa, freeipa_client, identity, sssd]

# ------------------------------------------------------------------------------
# Play 11: Centralized Log Ingestion Server on Monitoring Node
# ------------------------------------------------------------------------------
- name: Provision Centralized Log Ingestion Server
  hosts: monitoring
  become: true
  gather_facts: true

  roles:
    - role: central_logging
      tags: [logging, central_logging, logging_server]

# ------------------------------------------------------------------------------
# Play 12: Centralized Log Shipper across Cluster Nodes
# ------------------------------------------------------------------------------
- name: Provision Centralized Log Shipper Clients
  hosts: headless_nodes
  become: true
  gather_facts: true

  roles:
    - role: central_logging
      tags: [logging, central_logging, logging_client]
