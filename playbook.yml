---
# ==============================================================================
# Playbook: Headless Ubuntu Provisioning, Proxies & Webservers
# ==============================================================================

# ------------------------------------------------------------------------------
# Play 1: Base System, Security & User Provisioning for ALL Nodes
# ------------------------------------------------------------------------------
- name: Provision Core Systems, Security & Admin Users
  hosts: all
  become: true
  gather_facts: true

  vars_files:
    - vars/admin_users.yml

  roles:
    - role: system_base
      tags: [system_base, system, packages, tuning]

    - role: security
      tags: [security, ufw, firewall, ssh, sshd]

    - role: admin_users
      tags: [admin_users, users, dotfiles, venv]

# ------------------------------------------------------------------------------
# Play 2: Frontend HAProxy Load Balancers & SSL Certificate Orchestration
# ------------------------------------------------------------------------------
- name: Provision Frontend HAProxy Proxies
  hosts: proxies
  become: true
  gather_facts: true

  roles:
    - role: proxy
      tags: [proxy, haproxy, ssl, acme, certs, firewall]

# ------------------------------------------------------------------------------
# Play 3: Backend Webservers (Nginx, Default 404 Catch-All)
# ------------------------------------------------------------------------------
- name: Provision Backend Webservers
  hosts: webservers
  become: true
  gather_facts: true

  roles:
    - role: webserver
      tags: [webserver, nginx, sites, firewall]

# ------------------------------------------------------------------------------
# Play 4: Prometheus Monitoring Server
# ------------------------------------------------------------------------------
- name: Provision Prometheus Monitoring Server
  hosts: monitoring
  become: true
  gather_facts: true

  roles:
    - role: prometheus_server
      tags: [monitoring, prometheus, firewall]
