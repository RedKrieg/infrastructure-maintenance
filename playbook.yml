---
# ==============================================================================
# Playbook: Headless Ubuntu Provisioning, Proxies & Webservers
# ==============================================================================

# ------------------------------------------------------------------------------
# Play 1: Base System, Security & User Provisioning for ALL Nodes
# ------------------------------------------------------------------------------
- name: Provision Core Systems, Security & Admin Users
  hosts: all
  become: true
  gather_facts: true

  vars_files:
    - vars/admin_users.yml

  roles:
    - role: system_base
      tags: [system_base, system, packages, tuning]

    - role: security
      tags: [security, ufw, firewall, ssh, sshd]

    - role: admin_users
      tags: [admin_users, users, dotfiles, venv]

    - role: node_exporter
      tags: [node_exporter, monitoring, telemetry]

# ------------------------------------------------------------------------------
# Play 2: Proxy Ingress Foundation & Cluster Internal CA Authority
# ------------------------------------------------------------------------------
- name: Provision Proxy Ingress Foundation & Internal CA Authority
  hosts: proxies
  become: true
  gather_facts: true

  vars_files:
    - vars/admin_users.yml

  roles:
    - role: proxy
      vars:
        proxy_stage: "ca_foundation"
      tags: [proxy, haproxy, ssl, acme, certs, firewall, internal_ca]

# ------------------------------------------------------------------------------
# Play 3: Backend Webservers (Nginx, Zero-Trust TLS, Default 404 Catch-All)
# ------------------------------------------------------------------------------
- name: Provision Backend Webservers
  hosts: webservers
  become: true
  gather_facts: true

  roles:
    - role: webserver
      tags: [webserver, nginx, sites, firewall, ssl, tls]

# ------------------------------------------------------------------------------
# Play 4: Finalize HAProxy Load Balancers & Keepalived VRRP Routing
# ------------------------------------------------------------------------------
- name: Finalize HAProxy Ingress Routing & High Availability
  hosts: proxies
  become: true
  gather_facts: true

  vars_files:
    - vars/admin_users.yml

  roles:
    - role: proxy
      vars:
        proxy_stage: "routing"
      tags: [proxy, haproxy, routing]

    - role: keepalived
      tags: [keepalived, ha, vrrp]

# ------------------------------------------------------------------------------
# Play 5: Prometheus Monitoring Server
# ------------------------------------------------------------------------------
- name: Provision Prometheus Monitoring Server
  hosts: monitoring
  become: true
  gather_facts: true

  vars_files:
    - vars/admin_users.yml

  roles:
    - role: prometheus_server
      tags: [monitoring, prometheus, firewall]

    - role: grafana
      tags: [grafana, monitoring, telemetry, dashboards]

# ------------------------------------------------------------------------------
# Play 6: Centralized Identity & Access Management (Teleport or FreeIPA Server)
# ------------------------------------------------------------------------------
- name: Provision Teleport Auth & Proxy Server
  hosts: teleport_servers
  become: true
  gather_facts: true
  vars_files:
    - vars/admin_users.yml

  roles:
    - role: teleport_server
      when: identity_provider | default('teleport') == 'teleport'
      tags: [teleport, teleport_server, auth, rbac]

- name: Provision FreeIPA Centralized Identity Server
  hosts: freeipa_servers
  become: true
  gather_facts: true
  vars_files:
    - vars/admin_users.yml

  roles:
    - role: freeipa_server
      when:
        - identity_provider | default('teleport') == 'freeipa'
        - freeipa_deploy_server | default(true) | bool
      tags: [freeipa, freeipa_server, identity, auth]

# ------------------------------------------------------------------------------
# Play 7: Identity Client Integration across Cluster Nodes (Teleport or FreeIPA)
# ------------------------------------------------------------------------------
- name: Provision Teleport Node Service on Cluster Nodes
  hosts: headless_nodes
  become: true
  gather_facts: true

  roles:
    - role: teleport_node
      when: identity_provider | default('teleport') == 'teleport'
      tags: [teleport, teleport_node, ssh]

- name: Provision FreeIPA Client Enrollment across Cluster Nodes
  hosts: headless_nodes
  become: true
  gather_facts: true

  roles:
    - role: freeipa_client
      when: identity_provider | default('teleport') == 'freeipa'
      tags: [freeipa, freeipa_client, identity, sssd]

# ------------------------------------------------------------------------------
# Play 8: Centralized Log Ingestion Server on Monitoring Node
# ------------------------------------------------------------------------------
- name: Provision Centralized Log Ingestion Server
  hosts: monitoring
  become: true
  gather_facts: true

  roles:
    - role: central_logging
      tags: [logging, central_logging, logging_server]

# ------------------------------------------------------------------------------
# Play 9: Centralized Log Shipper across Cluster Nodes
# ------------------------------------------------------------------------------
- name: Provision Centralized Log Shipper Clients
  hosts: headless_nodes
  become: true
  gather_facts: true

  roles:
    - role: central_logging
      tags: [logging, central_logging, logging_client]
