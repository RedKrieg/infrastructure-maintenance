---
# ==============================================================================
# Cluster Automated Verification & Security Smoke Test Playbook
# ==============================================================================
# Validates post-deployment health, security enforcement, zero-trust policies,
# and telemetry metrics ingestion across all cluster tiers.
#
# Usage:
#   ansible-playbook -i inventory.ini verify_cluster.yml
# ==============================================================================

- name: Smoke Test & Health Check Cluster Nodes
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Verify system uptime and connectivity
      ansible.builtin.command:
        cmd: uptime
      changed_when: false
      register: uptime_out

    - name: Verify UFW firewall is active
      ansible.builtin.command:
        cmd: ufw status
      changed_when: false
      register: ufw_status
      failed_when: "'Status: active' not in ufw_status.stdout"

    - name: Verify Node Exporter service status
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        state: started
      check_mode: true
      register: node_exporter_service
      failed_when: node_exporter_service.changed

    - name: Verify local Node Exporter metrics endpoint
      ansible.builtin.uri:
        url: "{{ 'https://127.0.0.1:9100/metrics' if (node_exporter_enable_tls | default(enable_internal_tls | default(false)) | bool) else 'http://127.0.0.1:9100/metrics' }}"
        method: GET
        validate_certs: false
        status_code: 200
        timeout: 5
      register: node_exporter_resp

- name: Verify Frontend Load Balancers & Edge Security Policies
  hosts: proxies
  gather_facts: false
  become: true
  tasks:
    - name: Check HAProxy service state
      ansible.builtin.systemd:
        name: haproxy
        state: started
      check_mode: true
      register: haproxy_state
      failed_when: haproxy_state.changed

    - name: Validate HAProxy configuration syntax
      ansible.builtin.command:
        cmd: haproxy -c -f /etc/haproxy/haproxy.cfg
      changed_when: false
      register: haproxy_config_check
      failed_when: haproxy_config_check.rc != 0

    - name: Verify Keepalived service state (if enabled)
      ansible.builtin.systemd:
        name: keepalived
        state: started
      check_mode: true
      register: keepalived_state
      when: enable_keepalived | default(false) | bool
      failed_when: keepalived_state.changed

    - name: Verify HTTP to HTTPS redirection (Port 80 -> 443)
      ansible.builtin.uri:
        url: "http://127.0.0.1:80/"
        headers:
          Host: "{{ domain_name | default('example.com') }}"
        status_code: [301, 302]
        follow_redirects: none
        timeout: 5
      register: redirect_resp
      failed_when: redirect_resp.status not in [301, 302]

    - name: Verify default catch-all rejects unknown Host headers with HTTP 404
      ansible.builtin.uri:
        url: "http://127.0.0.1:80/"
        headers:
          Host: "unauthorized-unknown-domain.invalid"
        status_code: 404
        follow_redirects: none
        timeout: 5
      register: catchall_resp

    - name: Verify Coraza WAF blocks synthetic SQL injection payload
      ansible.builtin.uri:
        url: "http://127.0.0.1:80/?test=%27%20OR%201=1--"
        headers:
          Host: "{{ domain_name | default('example.com') }}"
        status_code: [403, 301, 302]
        timeout: 5
      register: waf_resp
      when: enable_coraza_waf | default(true) | bool

    - name: Verify HAProxy Prometheus Exporter stats socket/endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ haproxy_stats_port | default(8404) }}/metrics"
        method: GET
        user: "{{ haproxy_stats_user | default('admin') }}"
        password: "{{ haproxy_stats_password | default(vault_haproxy_stats_password) }}"
        force_basic_auth: true
        status_code: 200
        timeout: 5
      register: haproxy_metrics_resp

    - name: Verify Internal CA Signer daemon health (if CA enabled)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ internal_ca_signer_port | default(8444) }}/health"
        method: GET
        status_code: 200
        timeout: 5
      when: enable_internal_ca | default(true) | bool
      register: internal_ca_health_resp

- name: Verify Backend Webservers & Zero-Trust TLS
  hosts: webservers
  gather_facts: false
  become: true
  tasks:
    - name: Check Nginx service state
      ansible.builtin.systemd:
        name: nginx
        state: started
      check_mode: true
      register: nginx_state
      failed_when: nginx_state.changed

    - name: Validate Nginx configuration syntax
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false
      register: nginx_config_check
      failed_when: nginx_config_check.rc != 0

    - name: Verify local Nginx HTTP response
      ansible.builtin.uri:
        url: "http://127.0.0.1:80/"
        headers:
          Host: "{{ domain_name | default('example.com') }}"
        status_code: 200
        timeout: 5
      when: not (webserver_enable_ssl | default(false) | bool)
      register: web_resp_http

    - name: Verify backend internal TLS HTTPS response (if SSL enabled)
      ansible.builtin.uri:
        url: "https://127.0.0.1:443/"
        headers:
          Host: "{{ domain_name | default('example.com') }}"
        validate_certs: false
        status_code: 200
        timeout: 5
      when: webserver_enable_ssl | default(false) | bool
      register: web_resp_https

    - name: Verify internal certificate renewal timer is active
      ansible.builtin.systemd:
        name: renew-internal-cert.timer
        state: started
      check_mode: true
      register: renew_timer_state
      when: webserver_enable_ssl | default(false) | bool
      failed_when: renew_timer_state.changed

- name: Verify Teleport Access Gateway & Node Registration
  hosts: teleport_servers
  gather_facts: false
  become: true
  tasks:
    - name: Check Teleport service state
      ansible.builtin.systemd:
        name: teleport
        state: started
      check_mode: true
      register: teleport_state
      failed_when: teleport_state.changed

    - name: Check Teleport Access Request notification watcher service state
      ansible.builtin.systemd:
        name: teleport-access-watcher
        state: started
      check_mode: true
      register: teleport_watcher_state
      when: teleport_access_watcher_enabled | default(true) | bool
      failed_when: teleport_watcher_state.changed

    - name: Check Teleport cluster diagnostic status
      ansible.builtin.command:
        cmd: tctl status
      changed_when: false
      register: tctl_status
      failed_when: tctl_status.rc != 0

    - name: List registered cluster nodes
      ansible.builtin.command:
        cmd: tctl nodes ls
      changed_when: false
      register: tctl_nodes

    - name: Display connected Teleport nodes
      ansible.builtin.debug:
        var: tctl_nodes.stdout_lines

- name: Verify FreeIPA Centralized Identity Server
  hosts: freeipa_servers
  gather_facts: false
  become: true
  tasks:
    - name: Verify FreeIPA service state and directory health
      when: identity_provider | default('teleport') in ['freeipa', 'both']
      block:
        - name: Check FreeIPA systemd service state
          ansible.builtin.systemd:
            name: ipa
            state: started
          check_mode: true
          register: ipa_svc_state
          failed_when: ipa_svc_state.changed

        - name: Verify FreeIPA control status (KDC, 389 DS, PKI)
          ansible.builtin.command:
            cmd: ipactl status
          changed_when: false
          register: ipa_status_out
          failed_when: ipa_status_out.rc != 0

- name: Verify Observability Tier (Prometheus & Grafana)
  hosts: monitoring
  gather_facts: false
  become: true
  tasks:
    - name: Check Prometheus service state
      ansible.builtin.systemd:
        name: prometheus
        state: started
      check_mode: true
      register: prom_state
      failed_when: prom_state.changed

    - name: Verify Prometheus healthy API endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ prometheus_port | default(9090) }}/-/healthy"
        status_code: 200
        timeout: 5
      register: prom_healthy

    - name: Verify Prometheus targets endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ prometheus_port | default(9090) }}/api/v1/targets"
        status_code: 200
        timeout: 5
      register: prom_targets

    - name: Check Grafana service state
      ansible.builtin.systemd:
        name: grafana-server
        state: started
      check_mode: true
      register: grafana_state
      failed_when: grafana_state.changed

    - name: Verify Grafana health API endpoint
      ansible.builtin.uri:
        url: "{{ 'https' if (grafana_enable_tls | default(enable_internal_tls | default(false)) | bool) else 'http' }}://127.0.0.1:{{ grafana_port | default(3000) }}/api/health"
        validate_certs: false
        status_code: 200
        timeout: 5
      register: grafana_health
      failed_when: "'database' not in grafana_health.json or grafana_health.json.database != 'ok'"

- name: Verify Database Tier & Connection Pooling (if databases present)
  hosts: databases
  gather_facts: false
  become: true
  tasks:
    - name: Check database service state
      ansible.builtin.systemd:
        name: "{{ 'postgresql' if (db_engine | default('postgresql') == 'postgresql') else 'mysql' }}"
        state: started
      check_mode: true
      register: db_svc_state
      failed_when: db_svc_state.changed

    - name: Verify PostgreSQL responsiveness with pg_isready
      ansible.builtin.command:
        cmd: "pg_isready -h 127.0.0.1 -p {{ db_port | default(5432) }}"
      changed_when: false
      when: db_engine | default('postgresql') == 'postgresql'

    - name: Verify MySQL responsiveness with mysqladmin ping
      ansible.builtin.command:
        cmd: "mysqladmin ping"
      changed_when: false
      when: db_engine | default('postgresql') == 'mysql'

    - name: Verify PgBouncer connection pooler state (if enabled)
      ansible.builtin.systemd:
        name: pgbouncer
        state: started
      check_mode: true
      register: pgbouncer_svc_state
      when: enable_pgbouncer | default(false) | bool
      failed_when: pgbouncer_svc_state.changed

- name: Verify In-Memory Cache Tier (Redis)
  hosts: redis_servers
  gather_facts: false
  become: true
  tasks:
    - name: Check Redis service state
      ansible.builtin.systemd:
        name: redis-server
        state: started
      check_mode: true
      register: redis_svc_state
      failed_when: redis_svc_state.changed

    - name: Verify Redis PING responsiveness
      ansible.builtin.command:
        cmd: >
          redis-cli -p {{ redis_tls_port | default(redis_port | default(6379)) }}
          {% if redis_enable_tls | default(enable_internal_tls | default(false)) | bool %}--tls --cacert {{ redis_ca_cert | default('/etc/ssl/certs/internal-ca.crt') }}{% endif %}
          {% if redis_password is defined and redis_password %} -a '{{ redis_password }}'{% endif %}
          ping
      changed_when: false
      register: redis_ping_out
      failed_when: "'PONG' not in redis_ping_out.stdout"
      no_log: true

- name: Verify Message Broker Tier (RabbitMQ)
  hosts: rabbitmq_servers
  gather_facts: false
  become: true
  tasks:
    - name: Check RabbitMQ service state
      ansible.builtin.systemd:
        name: rabbitmq-server
        state: started
      check_mode: true
      register: rmq_svc_state
      failed_when: rmq_svc_state.changed

    - name: Verify RabbitMQ node health and diagnostics
      ansible.builtin.command:
        cmd: rabbitmq-diagnostics check_running
      changed_when: false

    - name: Verify RabbitMQ Management API health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ rabbitmq_mgmt_port | default(15672) }}/api/health/checks/alarms"
        method: GET
        user: "{{ rabbitmq_admin_user | default('admin') }}"
        password: "{{ rabbitmq_admin_password | default(vault_rabbitmq_admin_password) }}"
        force_basic_auth: true
        status_code: 200
        timeout: 5
      register: rmq_api_resp

- name: Cluster Verification Summary
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Print Verification Pass Banner
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "           CLUSTER COMPLIANCE VERIFICATION PASSED         "
          - "=========================================================="
          - " [✓] System Uptime & UFW Security Profiles Active"
          - " [✓] Node Exporter Telemetry Active on Port 9100"
          - " [✓] HAProxy Edge Load Balancer & Keepalived VRRP Verified"
          - " [✓] HTTP to HTTPS 301/302 Redirection & 404 Catch-All OK"
          - " [✓] Coraza WAF Threat Mitigation & Stats Metrics OK"
          - " [✓] Webserver Nginx & Zero-Trust Backend TLS Validated"
          - " [✓] Database Tier (PostgreSQL/MySQL & PgBouncer) Health Verified"
          - " [✓] Redis In-Memory Cache & Session Store Responsive"
          - " [✓] RabbitMQ Message Broker & Management API Operational"
          - " [✓] Teleport Zero-Trust Access Gateway & Nodes Registered"
          - " [✓] FreeIPA Centralized Identity Server Operational (when enabled)"
          - " [✓] Prometheus Server & Grafana Telemetry Dashboards Ready"
          - "=========================================================="
