---
# ==============================================================================
# Cluster Backup & Disaster Recovery Configuration Example
# ==============================================================================
# Copy this file to vars/backup_config.yml and configure your target backup destination.
#
# Supported Destinations:
#   - local:       Store archives locally on the Ansible controller or backup host.
#   - remote_ssh:  Transfer archives to a remote backup server using SSH / SCP / Rsync.
#   - s3:          Upload archives to an AWS S3 or S3-compatible (MinIO, R2, Ceph) bucket.
# ==============================================================================

# Temporary staging directory on target nodes during archiving
backup_staging_dir: "/var/backups/ansible-cluster/staging"
backup_retention_days: 30
backup_compression: "gz"  # gz, bz2, xz

# Destination type: "local", "remote_ssh", or "s3"
backup_destination_type: "local"

# ------------------------------------------------------------------------------
# 1. Local Destination Settings
# ------------------------------------------------------------------------------
backup_local_dir: "/var/backups/ansible-cluster/archives"

# ------------------------------------------------------------------------------
# 2. Remote SSH / SFTP Destination Settings (Active when destination is 'remote_ssh')
# ------------------------------------------------------------------------------
backup_remote_ssh_host: "backup.internal.company.com"
backup_remote_ssh_port: 22
backup_remote_ssh_user: "backup-operator"
backup_remote_ssh_key: "~/.ssh/id_ed25519"
backup_remote_ssh_dir: "/storage/backups/ansible-cluster"

# ------------------------------------------------------------------------------
# 3. S3 / MinIO Object Storage Settings (Active when destination is 's3')
# ------------------------------------------------------------------------------
backup_s3_bucket: "prod-cluster-disaster-recovery-backups"
backup_s3_endpoint_url: ""  # Leave blank for AWS S3, or e.g. "https://minio.internal:9000"
backup_s3_region: "us-east-1"
backup_s3_access_key: "{{ vault_backup_s3_access_key | default('') }}"
backup_s3_secret_key: "{{ vault_backup_s3_secret_key | default('') }}"
backup_s3_prefix: "cluster-backups"

# ------------------------------------------------------------------------------
# Component Backup Selectors (Enable / Disable components)
# ------------------------------------------------------------------------------
backup_include_tls_and_acme: true
backup_include_proxy_config: true
backup_include_teleport_state: true
backup_include_webserver_data: true
backup_include_monitoring_state: true
