---
# ==============================================================================
# Firewall Configuration for FreeIPA Server
# ==============================================================================

- name: Allow FreeIPA Web UI (HTTP/HTTPS) from Admin CIDRs
  community.general.ufw:
    rule: allow
    port: "{{ item[0] }}"
    proto: tcp
    from_ip: "{{ item[1] }}"
    comment: "FreeIPA Web UI Admin Access"
  loop: "{{ ['80', '443'] | product(freeipa_admin_trusted_cidrs) | list }}"

- name: Allow FreeIPA Web UI (HTTP/HTTPS) from Internal Cluster Subnets
  community.general.ufw:
    rule: allow
    port: "{{ item[0] }}"
    proto: tcp
    from_ip: "{{ item[1] }}"
    comment: "FreeIPA Web UI Cluster Access"
  loop: "{{ ['80', '443'] | product(freeipa_trusted_subnets) | list }}"

- name: Allow Kerberos & LDAP authentication ports from Internal Cluster Subnets
  community.general.ufw:
    rule: allow
    port: "{{ item[0].port }}"
    proto: "{{ item[0].proto }}"
    from_ip: "{{ item[1] }}"
    comment: "{{ item[0].comment }}"
  loop: "{{ freeipa_server_ports | rejectattr('port', 'in', ['80', '443']) | list | product(freeipa_trusted_subnets) | list }}"

- name: Allow BIND9 DNS ports from Internal Cluster Subnets
  community.general.ufw:
    rule: allow
    port: "{{ item[0].port }}"
    proto: "{{ item[0].proto }}"
    from_ip: "{{ item[1] }}"
    comment: "{{ item[0].comment }}"
  loop: "{{ freeipa_dns_ports | product(freeipa_trusted_subnets) | list }}"
  when: freeipa_setup_dns | bool
