---
# ==============================================================================
# Handlers for prometheus_server Role
# ==============================================================================

- name: Restart prometheus
  ansible.builtin.systemd:
    name: "{{ prometheus_service_name }}"
    state: restarted

- name: Reload prometheus
  ansible.builtin.systemd:
    name: "{{ prometheus_service_name }}"
    state: reloaded

- name: Restart alertmanager
  ansible.builtin.systemd:
    name: "{{ prometheus_alertmanager_service | default('prometheus-alertmanager') }}"
    state: restarted

- name: Reload alertmanager
  ansible.builtin.systemd:
    name: "{{ prometheus_alertmanager_service | default('prometheus-alertmanager') }}"
    state: reloaded

- name: Restart alertmanager-google-chat-relay
  ansible.builtin.systemd:
    name: alertmanager-google-chat-relay
    daemon_reload: true
    state: restarted
  when:
    - prometheus_alertmanager_enabled | bool
    - alertmanager_google_chat_webhook_url | default('') | length > 0
