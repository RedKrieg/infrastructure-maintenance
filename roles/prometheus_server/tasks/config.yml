---
# ==============================================================================
# Prometheus Configuration & Service Management
# ==============================================================================

- name: Ensure Prometheus configuration directory exists
  ansible.builtin.file:
    path: "{{ prometheus_config_dir }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"
  tags: [monitoring, prometheus, config]

- name: Deploy Prometheus daemon defaults (retention time)
  ansible.builtin.template:
    src: prometheus-default.j2
    dest: /etc/default/prometheus
    owner: root
    group: root
    mode: "0644"
  notify: Restart prometheus
  tags: [monitoring, prometheus, config]

- name: Deploy Prometheus alerting rules
  ansible.builtin.template:
    src: alert.rules.yml.j2
    dest: "{{ prometheus_alert_rules_file }}"
    owner: prometheus
    group: prometheus
    mode: "0644"
    validate: "promtool check rules %s"
  when: prometheus_enable_alerts | bool
  notify: Reload prometheus
  tags: [monitoring, prometheus, config, alerts]

- name: Deploy Prometheus scrape configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_file }}"
    owner: prometheus
    group: prometheus
    mode: "0644"
    validate: "promtool check config %s"
  notify: Reload prometheus
  tags: [monitoring, prometheus, config]

- name: Deploy Alertmanager configuration
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ prometheus_alertmanager_config_file | default('/etc/prometheus/alertmanager.yml') }}"
    owner: prometheus
    group: prometheus
    mode: "0640"
  when: prometheus_alertmanager_enabled | bool
  notify: Reload alertmanager
  tags: [monitoring, prometheus, config, alertmanager]

- name: Deploy Google Chat webhook relay script for Alertmanager
  ansible.builtin.copy:
    src: "{{ role_path }}/../../examples/alertmanager/google_chat_relay.py"
    dest: /usr/local/bin/alertmanager-google-chat-relay
    owner: root
    group: root
    mode: "0755"
  when:
    - prometheus_alertmanager_enabled | bool
    - alertmanager_google_chat_webhook_url | default('') | length > 0
  notify: Restart alertmanager-google-chat-relay
  tags: [monitoring, prometheus, config, alertmanager]

- name: Deploy Google Chat webhook relay systemd service
  ansible.builtin.template:
    src: alertmanager-google-chat-relay.service.j2
    dest: /etc/systemd/system/alertmanager-google-chat-relay.service
    owner: root
    group: prometheus
    mode: "0640"
  when:
    - prometheus_alertmanager_enabled | bool
    - alertmanager_google_chat_webhook_url | default('') | length > 0
  notify: Restart alertmanager-google-chat-relay
  tags: [monitoring, prometheus, config, alertmanager]

- name: Ensure Google Chat webhook relay service is enabled and started
  ansible.builtin.systemd:
    name: alertmanager-google-chat-relay
    daemon_reload: true
    state: started
    enabled: true
  when:
    - prometheus_alertmanager_enabled | bool
    - alertmanager_google_chat_webhook_url | default('') | length > 0
  tags: [monitoring, prometheus, service, alertmanager]

- name: Ensure Alertmanager service is enabled and started
  ansible.builtin.systemd:
    name: "{{ prometheus_alertmanager_service | default('prometheus-alertmanager') }}"
    state: started
    enabled: true
  when: prometheus_alertmanager_enabled | bool
  tags: [monitoring, prometheus, service, alertmanager]

- name: Ensure Prometheus service is enabled and started
  ansible.builtin.systemd:
    name: "{{ prometheus_service_name }}"
    state: started
    enabled: true
  tags: [monitoring, prometheus, service]
