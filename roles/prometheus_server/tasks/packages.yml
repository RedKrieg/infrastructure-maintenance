---
# ==============================================================================
# Prometheus Package Installation
# ==============================================================================

- name: Install Prometheus and monitoring tools
  ansible.builtin.apt:
    name:
      - prometheus
      - "{{ prometheus_alertmanager_package | default('prometheus-alertmanager') if (prometheus_alertmanager_enabled | bool) else 'curl' }}"
      - curl
    state: present
  tags: [monitoring, prometheus, packages]
