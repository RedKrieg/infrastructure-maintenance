---
# ==============================================================================
# Firewall Rules for Prometheus Server
# ==============================================================================

- name: Allow Prometheus port (9090) through UFW from trusted subnets
  community.general.ufw:
    rule: allow
    port: "{{ prometheus_port | string }}"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ prometheus_trusted_subnets }}"
  tags: [monitoring, prometheus, firewall, ufw]

- name: Allow Alertmanager port (9093) through UFW from trusted subnets
  community.general.ufw:
    rule: allow
    port: "{{ prometheus_alertmanager_port | default(9093) | string }}"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ prometheus_trusted_subnets }}"
  when: prometheus_alertmanager_enabled | bool
  tags: [monitoring, prometheus, firewall, ufw, alertmanager]
