---
# ==============================================================================
# Maintenance, Upgrades & Reboot Scheduling
# ==============================================================================

- name: Configure needrestart for automatic non-interactive daemon restarts
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/auto-restart.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible - Automatic non-interactive daemon restarts after updates
      $nrconf{restart} = 'a';
      $nrconf{ui} = 'NeedRestart::UI::stdio';
  when: enable_needrestart_auto | bool
  tags: [maintenance, system]

- name: Enforce Dpkg force-confold to preserve customized configurations on update
  ansible.builtin.copy:
    dest: /etc/dpkg/dpkg.cfg.d/force-confold
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible - Keep existing configuration when upstream packages change
      force-confdef
      force-confold
  when: enable_unattended_upgrades | bool
  tags: [maintenance, system]

- name: Configure APT periodic update intervals
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by Ansible - Daily automated security update checks
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
  when: enable_unattended_upgrades | bool
  tags: [maintenance, system]

- name: Configure unattended-upgrades with force-confold and scheduled reboot
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-reboot
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by Ansible - Scheduled automatic reboots and config preservation
      Dpkg::Options {
         "--force-confdef";
         "--force-confold";
      };
      Unattended-Upgrade::AutoFixInterruptedDpkg "true";
      Unattended-Upgrade::MinimalSteps "true";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "{{ unattended_reboot_time }}";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
  when: enable_unattended_upgrades | bool
  tags: [maintenance, system]

- name: Configure system timezone
  community.general.timezone:
    name: "{{ system_timezone }}"
  when: system_timezone is defined
  tags: [maintenance, system]

- name: Ensure systemd-timesyncd is enabled for NTP time synchronization
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started
  ignore_errors: true
  tags: [maintenance, system]
