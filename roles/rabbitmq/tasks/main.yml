---
# ==============================================================================
# Tasks: RabbitMQ Message Broker & Task Queue Deployment
# ==============================================================================

- name: Install RabbitMQ server and client packages
  ansible.builtin.apt:
    name:
      - rabbitmq-server
      - python3-pika
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure RabbitMQ configuration and working directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: rabbitmq
    group: rabbitmq
    mode: "0750"
  loop:
    - /etc/rabbitmq
    - /var/lib/rabbitmq
    - /var/log/rabbitmq

- name: Grant rabbitmq user ssl-cert group membership for AMQP TLS
  ansible.builtin.user:
    name: rabbitmq
    groups: ssl-cert
    append: true
  when: rabbitmq_enable_tls | default(enable_internal_tls | default(false)) | bool
  notify: restart rabbitmq-server

- name: Configure Erlang cluster secret cookie
  ansible.builtin.copy:
    content: "{{ rabbitmq_erlang_cookie }}"
    dest: /var/lib/rabbitmq/.erlang.cookie
    owner: rabbitmq
    group: rabbitmq
    mode: "0400"
  notify: restart rabbitmq-server

- name: Deploy RabbitMQ configuration
  ansible.builtin.template:
    src: rabbitmq.conf.j2
    dest: /etc/rabbitmq/rabbitmq.conf
    owner: rabbitmq
    group: rabbitmq
    mode: "0640"
  notify: restart rabbitmq-server

- name: Enable RabbitMQ plugins (Management & Prometheus)
  community.rabbitmq.rabbitmq_plugin:
    names: "{{ rabbitmq_plugins | join(',') }}"
    state: enabled
  notify: restart rabbitmq-server

- name: Configure UFW firewall for RabbitMQ AMQP port
  community.general.ufw:
    rule: allow
    proto: tcp
    port: "{{ rabbitmq_amqp_port | string }}"
    src: "{{ item }}"
    comment: "Allow RabbitMQ AMQP from {{ item }}"
  loop: "{{ rabbitmq_trusted_subnets }}"
  when: rabbitmq_trusted_subnets is defined and rabbitmq_trusted_subnets | length > 0

- name: Configure UFW firewall for RabbitMQ AMQP TLS port
  community.general.ufw:
    rule: allow
    proto: tcp
    port: "{{ rabbitmq_amqp_ssl_port | default(5671) | string }}"
    src: "{{ item }}"
    comment: "Allow RabbitMQ AMQP TLS from {{ item }}"
  loop: "{{ rabbitmq_trusted_subnets }}"
  when:
    - rabbitmq_enable_tls | default(enable_internal_tls | default(false)) | bool
    - rabbitmq_trusted_subnets is defined and rabbitmq_trusted_subnets | length > 0

- name: Configure UFW firewall for RabbitMQ Management UI port
  community.general.ufw:
    rule: allow
    proto: tcp
    port: "{{ rabbitmq_mgmt_port | string }}"
    src: "{{ item }}"
    comment: "Allow RabbitMQ Management Web UI from {{ item }}"
  loop: "{{ rabbitmq_admin_cidrs }}"
  when: rabbitmq_admin_cidrs is defined and rabbitmq_admin_cidrs | length > 0

- name: Configure UFW firewall for RabbitMQ Prometheus metrics
  community.general.ufw:
    rule: allow
    proto: tcp
    port: "{{ rabbitmq_prometheus_port | string }}"
    src: "{{ hostvars[item]['internal_ip'] | default(hostvars[item]['ansible_host'] | default(item)) }}"
    comment: "Allow RabbitMQ Prometheus metrics scrape from monitoring node {{ item }}"
  loop: "{{ groups['monitoring'] | default([]) }}"
  when: groups['monitoring'] is defined and groups['monitoring'] | length > 0

- name: Ensure RabbitMQ service is running and enabled
  ansible.builtin.systemd:
    name: rabbitmq-server
    state: started
    enabled: true

- name: Flush handlers to ensure service is restarted if config or plugins changed
  ansible.builtin.meta: flush_handlers

- name: Wait for RabbitMQ AMQP port to become available
  ansible.builtin.wait_for:
    port: "{{ rabbitmq_amqp_port }}"
    host: 127.0.0.1
    timeout: 30

- name: Ensure application vhost exists
  community.rabbitmq.rabbitmq_vhost:
    name: "{{ rabbitmq_vhost }}"
    state: present

- name: Ensure application user is configured
  community.rabbitmq.rabbitmq_user:
    user: "{{ rabbitmq_user }}"
    password: "{{ rabbitmq_password }}"
    vhost: "{{ rabbitmq_vhost }}"
    configure_priv: ".*"
    read_priv: ".*"
    write_priv: ".*"
    state: present
  no_log: true

- name: Ensure management administrator user is configured
  community.rabbitmq.rabbitmq_user:
    user: "{{ rabbitmq_admin_user }}"
    password: "{{ rabbitmq_admin_password }}"
    tags: "administrator"
    vhost: "/"
    configure_priv: ".*"
    read_priv: ".*"
    write_priv: ".*"
    state: present
  no_log: true

- name: Grant administrator user access to application vhost
  community.rabbitmq.rabbitmq_user:
    user: "{{ rabbitmq_admin_user }}"
    vhost: "{{ rabbitmq_vhost }}"
    configure_priv: ".*"
    read_priv: ".*"
    write_priv: ".*"
    state: present

- name: Remove default guest user for security
  community.rabbitmq.rabbitmq_user:
    user: guest
    state: absent
  ignore_errors: true

- name: Verify RabbitMQ diagnostics check
  ansible.builtin.command:
    cmd: rabbitmq-diagnostics check_running
  changed_when: false
