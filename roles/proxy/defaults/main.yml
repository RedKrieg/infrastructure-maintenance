---
# ==============================================================================
# Default Variables for proxy (HAProxy) Role
# ==============================================================================

# HAProxy global settings
haproxy_user: "haproxy"
haproxy_group: "haproxy"
haproxy_maxconn: 4096
haproxy_timeout_connect: "5000ms"
haproxy_timeout_client: "50000ms"
haproxy_timeout_server: "50000ms"

# SSL & Certificates Configuration (SSL is decoded/terminated on the proxies)
haproxy_certs_dir: "/etc/haproxy/certs"
acme_sh_install_dir: "/root/.acme.sh"
acme_email: "admin@example.com"
acme_default_ca: "letsencrypt"
acme_standalone_port: 8888

# Primary proxy that owns requesting and renewing certificates from Let's Encrypt
# Defaults to the first host in the [proxies] inventory group
cert_primary_host: "{{ groups['proxies'][0] if (groups['proxies'] is defined and groups['proxies'] | length > 0) else inventory_hostname }}"
enable_cert_sync_between_proxies: true
internal_proxy_subnet: "10.0.0.0/8"

# Option A: Standby renewal watchdog on replica proxies
# If primary is dead and certs have fewer than N days remaining, replica auto-renews
enable_fallback_watchdog: true
acme_fallback_renewal_days: 15

# When false, uses self-signed bootstrap SSL certificates for the domains.
# Set to true when domains resolve via public DNS to your HAProxy frontends.
acme_issue_certs: false
acme_use_staging: false

# Stats listener configuration
haproxy_enable_stats: true
haproxy_stats_port: 8404
haproxy_stats_uri: "/stats"
haproxy_stats_refresh: "10s"
haproxy_stats_user: "admin"
haproxy_stats_password: "adminpassword"

# Frontend binding ports
haproxy_bind_http_port: 80
haproxy_bind_https_port: 443
