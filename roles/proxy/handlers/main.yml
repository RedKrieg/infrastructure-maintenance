---
# ==============================================================================
# Handlers for proxy Role
# ==============================================================================

- name: Restart haproxy
  ansible.builtin.systemd:
    name: haproxy
    state: restarted

- name: Reload haproxy
  ansible.builtin.systemd:
    name: haproxy
    state: reloaded

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
