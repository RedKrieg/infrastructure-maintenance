---
# ==============================================================================
# HAProxy Configuration & Service Management
# ==============================================================================

- name: Ensure HAProxy error directory exists
  ansible.builtin.file:
    path: /etc/haproxy/errors
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [proxy, haproxy]

- name: Deploy custom 404 HTTP fallback response
  ansible.builtin.copy:
    dest: /etc/haproxy/errors/404.http
    owner: root
    group: root
    mode: "0644"
    content: |
      HTTP/1.0 404 Not Found
      Cache-Control: no-cache
      Connection: close
      Content-Type: text/plain

      404 Not Found
  tags: [proxy, haproxy]

- name: Deploy HAProxy configuration template
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
    validate: "haproxy -c -f %s"
  notify: Reload haproxy
  tags: [proxy, haproxy]

- name: Ensure HAProxy service is enabled and running
  ansible.builtin.systemd:
    name: haproxy
    enabled: true
    state: started
  tags: [proxy, haproxy]
