---
# ==============================================================================
# SSL Certificate Management, Deduplication & Standby Failover on Proxies
#
# Primary Proxy ({{ cert_primary_host }}) performs normal renewals and pushes to replicas.
# Replicas maintain a rank-based line of succession with 1-day staggered fallback windows:
#   Rank 1 (proxy-02): triggers at 15 days
#   Rank 2 (proxy-03): triggers at 14 days
#   Rank 3 (proxy-04): triggers at 13 days
# If a higher-ranking proxy recovers after renewal, its systemd boot service
# (haproxy-cert-reconcile.service) checks all peers, adopts the newer certificate,
# reloads HAProxy, and resumes its normal rank in the succession system.
# ==============================================================================

- name: Ensure HAProxy certificates directory exists across all proxies
  ansible.builtin.file:
    path: "{{ haproxy_certs_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: [proxy, ssl, certs]

- name: Build list of external FQDNs from cluster groups
  ansible.builtin.set_fact:
    target_fqdns: >-
      {{
        ((groups['webservers'] | default([]) | map('extract', hostvars, 'external_fqdn') | select('defined') | list) +
         (groups['teleport_servers'] | default(groups['teleport'] | default([])) | map('extract', hostvars, 'external_fqdn') | select('defined') | list) +
         ([teleport_fqdn] if (teleport_fqdn is defined and teleport_fqdn | length > 0) else []) +
         ([monitoring_fqdn] if (monitoring_fqdn is defined and monitoring_fqdn | length > 0) else []) +
         ([grafana_fqdn] if (grafana_fqdn is defined and grafana_fqdn | length > 0) else []) +
         ([domain_name] if (domain_name is defined and domain_name | length > 0) else [])) | unique | list
      }}
  tags: [proxy, ssl, certs]

- name: Determine certificate issuance strategy (wildcard via DNS-01 vs individual via HTTP-01)
  ansible.builtin.set_fact:
    enable_wildcard_cert: >-
      {{
        (enable_wildcard_cert | default(false) | bool) and
        (acme_dns_provider is defined and acme_dns_provider | length > 0)
      }}
    wildcard_cert_name: "wildcard.{{ domain_name }}"
  tags: [proxy, ssl, certs]

- name: Set certificate target list based on issuance strategy
  ansible.builtin.set_fact:
    cert_targets: "{{ [wildcard_cert_name] if (enable_wildcard_cert | bool) else target_fqdns }}"
  tags: [proxy, ssl, certs]

# ==============================================================================
# Install acme.sh on ALL Proxies (Standby Ready)
# ==============================================================================
- name: Check if acme.sh is installed
  ansible.builtin.stat:
    path: "{{ acme_sh_install_dir }}/acme.sh"
  register: acme_sh_stat
  tags: [proxy, acme, ssl]

- name: Install acme.sh client
  ansible.builtin.shell:
    cmd: "curl -sSL https://get.acme.sh | sh -s email={{ acme_email }}"
  when: not acme_sh_stat.stat.exists
  args:
    creates: "{{ acme_sh_install_dir }}/acme.sh"
  tags: [proxy, acme, ssl]

- name: Configure acme.sh default CA to Let's Encrypt
  ansible.builtin.command:
    cmd: "{{ acme_sh_install_dir }}/acme.sh --set-default-ca --server {{ acme_default_ca }}"
  changed_when: false
  tags: [proxy, acme, ssl]

# ==============================================================================
# Primary Proxy Tasks: Certificate Issuance and Initial Setup
# ==============================================================================
- name: Primary Proxy Certificate Management Block
  when: inventory_hostname == cert_primary_host
  tags: [proxy, ssl, certs]
  block:
    # --- Wildcard Certificate Generation (When DNS service access is available) ---
    - name: Check existing wildcard certificate on Primary Proxy
      when: enable_wildcard_cert | bool
      ansible.builtin.stat:
        path: "{{ haproxy_certs_dir }}/{{ wildcard_cert_name }}.pem"
      register: wildcard_cert_stat

    - name: Generate bootstrap self-signed wildcard SSL bundle on Primary Proxy
      when:
        - enable_wildcard_cert | bool
        - not wildcard_cert_stat.stat.exists
      ansible.builtin.shell:
        cmd: >
          openssl req -x509 -nodes -days 365 -newkey rsa:2048
          -keyout /tmp/{{ wildcard_cert_name }}.key
          -out /tmp/{{ wildcard_cert_name }}.crt
          -subj "/CN=*.{{ domain_name }}"
          -addext "subjectAltName=DNS:*.{{ domain_name }},DNS:{{ domain_name }}" &&
          cat /tmp/{{ wildcard_cert_name }}.crt /tmp/{{ wildcard_cert_name }}.key > {{ haproxy_certs_dir }}/{{ wildcard_cert_name }}.pem &&
          chmod 600 {{ haproxy_certs_dir }}/{{ wildcard_cert_name }}.pem &&
          rm -f /tmp/{{ wildcard_cert_name }}.key /tmp/{{ wildcard_cert_name }}.crt

    # --- Individual Certificate Generation (Fallback when DNS access is NOT available) ---
    - name: Check existing individual certificates on Primary Proxy
      when: not (enable_wildcard_cert | bool)
      ansible.builtin.stat:
        path: "{{ haproxy_certs_dir }}/{{ item }}.pem"
      register: cert_stats_primary
      loop: "{{ target_fqdns }}"

    - name: Generate bootstrap self-signed individual SSL bundles on Primary Proxy
      when:
        - not (enable_wildcard_cert | bool)
        - not item.stat.exists
      ansible.builtin.shell:
        cmd: >
          openssl req -x509 -nodes -days 365 -newkey rsa:2048
          -keyout /tmp/{{ item.item }}.key
          -out /tmp/{{ item.item }}.crt
          -subj "/CN={{ item.item }}" &&
          cat /tmp/{{ item.item }}.crt /tmp/{{ item.item }}.key > {{ haproxy_certs_dir }}/{{ item.item }}.pem &&
          chmod 600 {{ haproxy_certs_dir }}/{{ item.item }}.pem &&
          rm -f /tmp/{{ item.item }}.key /tmp/{{ item.item }}.crt
      loop: "{{ cert_stats_primary.results | default([]) }}"

    # --- Real Let's Encrypt Certificate Issuance (when acme_issue_certs is enabled) ---
    - name: Issue Let's Encrypt certificates on Primary Proxy
      when: acme_issue_certs | bool
      block:
        # Case A: Wildcard Certificate via DNS-01 Challenge (DNS access available)
        - name: Request wildcard certificate via acme.sh DNS-01 on Primary Proxy
          when: enable_wildcard_cert | bool
          ansible.builtin.command:
            cmd: >
              {{ acme_sh_install_dir }}/acme.sh --issue
              -d {{ domain_name }}
              -d "*.{{ domain_name }}"
              --dns {{ acme_dns_provider }}
              --keylength ec-256
              {% if acme_use_staging | bool %}--staging{% endif %}
          environment: "{{ acme_dns_env | default({}) }}"
          register: acme_wildcard_issue_result
          failed_when: false
          changed_when: "'Cert success' in acme_wildcard_issue_result.stdout"

        - name: Bundle and install wildcard certificate into HAProxy format on Primary Proxy
          when:
            - enable_wildcard_cert | bool
            - acme_wildcard_issue_result is defined
          ansible.builtin.shell:
            cmd: >
              {{ acme_sh_install_dir }}/acme.sh --install-cert -d {{ domain_name }} --ecc
              --fullchain-file /tmp/{{ wildcard_cert_name }}_fullchain.crt
              --key-file /tmp/{{ wildcard_cert_name }}_key.key
              --reloadcmd "cat /tmp/{{ wildcard_cert_name }}_fullchain.crt /tmp/{{ wildcard_cert_name }}_key.key > {{ haproxy_certs_dir }}/{{ wildcard_cert_name }}.pem && chmod 600 {{ haproxy_certs_dir }}/{{ wildcard_cert_name }}.pem && rm -f /tmp/{{ wildcard_cert_name }}_* && /usr/local/bin/sync-haproxy-certs.sh"
          changed_when: false

        # Case B: Individual Certificates via HTTP-01 Standalone (DNS access NOT available)
        - name: Request individual certificates via acme.sh standalone HTTP-01 on Primary Proxy
          when: not (enable_wildcard_cert | bool)
          ansible.builtin.command:
            cmd: >
              {{ acme_sh_install_dir }}/acme.sh --issue
              -d {{ item }}
              --standalone
              --httpport {{ acme_standalone_port }}
              --keylength ec-256
              {% if acme_use_staging | bool %}--staging{% endif %}
          loop: "{{ target_fqdns }}"
          register: acme_issue_result
          failed_when: false
          changed_when: "'Cert success' in acme_issue_result.stdout"

        - name: Bundle and install individual certificates into HAProxy format on Primary Proxy
          when:
            - not (enable_wildcard_cert | bool)
            - acme_issue_result is defined
          ansible.builtin.shell:
            cmd: >
              {{ acme_sh_install_dir }}/acme.sh --install-cert -d {{ item }}
              --fullchain-file /tmp/{{ item }}_fullchain.crt
              --key-file /tmp/{{ item }}_key.key
              --reloadcmd "cat /tmp/{{ item }}_fullchain.crt /tmp/{{ item }}_key.key > {{ haproxy_certs_dir }}/{{ item }}.pem && chmod 600 {{ haproxy_certs_dir }}/{{ item }}.pem && rm -f /tmp/{{ item }}_* && /usr/local/bin/sync-haproxy-certs.sh"
          loop: "{{ target_fqdns }}"
          changed_when: false

# ==============================================================================
# Certificate Distribution from Primary to ALL Replica Proxies
# ==============================================================================
- name: Slurp certificate bundles from Primary Proxy
  ansible.builtin.slurp:
    src: "{{ haproxy_certs_dir }}/{{ item }}.pem"
  delegate_to: "{{ cert_primary_host }}"
  run_once: true
  register: slurped_certs
  loop: "{{ cert_targets }}"
  tags: [proxy, ssl, certs]

- name: Store slurped certificates in a structured map
  ansible.builtin.set_fact:
    primary_ssl_bundles: >-
      {{
        primary_ssl_bundles | default({}) |
        combine({ item.item: (item.content | b64decode) })
      }}
  loop: "{{ slurped_certs.results }}"
  no_log: true
  tags: [proxy, ssl, certs]

- name: Deploy identical certificates to all Replica Proxies
  when: inventory_hostname != cert_primary_host
  ansible.builtin.copy:
    dest: "{{ haproxy_certs_dir }}/{{ item }}.pem"
    content: "{{ primary_ssl_bundles[item] }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ cert_targets }}"
  notify: Reload haproxy
  tags: [proxy, ssl, certs]

# ==============================================================================
# Cluster SSH Key Pair & Mutual Synchronization Setup (Across ALL Proxies)
# ==============================================================================
- name: Configure Cluster SSH Key & Mutual Synchronization
  when: enable_cert_sync_between_proxies | bool
  tags: [proxy, ssl, certs]
  block:
    - name: Generate SSH keypair on Primary Proxy for cluster cert synchronization
      when: inventory_hostname == cert_primary_host
      community.crypto.openssh_keypair:
        path: /root/.ssh/id_ed25519_certsync
        type: ed25519
        owner: root
        group: root
        mode: "0600"
        state: present
      register: primary_sync_key

    - name: Slurp private sync key from Primary Proxy
      ansible.builtin.slurp:
        src: /root/.ssh/id_ed25519_certsync
      delegate_to: "{{ cert_primary_host }}"
      run_once: true
      register: cluster_sync_privkey

    - name: Slurp public sync key from Primary Proxy
      ansible.builtin.slurp:
        src: /root/.ssh/id_ed25519_certsync.pub
      delegate_to: "{{ cert_primary_host }}"
      run_once: true
      register: cluster_sync_pubkey

    - name: Ensure /root/.ssh directory exists on all proxies
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Deploy private sync key to all Replica Proxies
      when: inventory_hostname != cert_primary_host
      ansible.builtin.copy:
        dest: /root/.ssh/id_ed25519_certsync
        content: "{{ cluster_sync_privkey.content | b64decode }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Deploy public sync key to all Replica Proxies
      when: inventory_hostname != cert_primary_host
      ansible.builtin.copy:
        dest: /root/.ssh/id_ed25519_certsync.pub
        content: "{{ cluster_sync_pubkey.content | b64decode }}"
        owner: root
        group: root
        mode: "0644"

    - name: Authorize cluster sync public key across ALL Proxies
      ansible.posix.authorized_key:
        user: root
        key: "{{ cluster_sync_pubkey.content | b64decode }}"
        state: present

    - name: Deploy sync-haproxy-certs.sh script on ALL Proxies
      ansible.builtin.template:
        src: sync-haproxy-certs.sh.j2
        dest: /usr/local/bin/sync-haproxy-certs.sh
        owner: root
        group: root
        mode: "0755"

    - name: Deploy check-and-adopt-cluster-certs.sh script on ALL Proxies
      ansible.builtin.template:
        src: check-and-adopt-cluster-certs.sh.j2
        dest: /usr/local/bin/check-and-adopt-cluster-certs.sh
        owner: root
        group: root
        mode: "0755"

    - name: Deploy HAProxy cluster cert reconciliation systemd service on ALL Proxies
      ansible.builtin.copy:
        dest: /etc/systemd/system/haproxy-cert-reconcile.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=HAProxy Cluster Certificate Reconciliation and Adoption
          Before=haproxy.service
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/check-and-adopt-cluster-certs.sh
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target haproxy.service
      notify: Reload systemd daemon

    - name: Enable HAProxy cert reconciliation service on ALL Proxies
      ansible.builtin.systemd:
        name: haproxy-cert-reconcile.service
        enabled: true

# ==============================================================================
# Standby Fallback Renewal Watchdog Setup (On Replica Proxies)
# ==============================================================================
- name: Configure Standby Renewal Watchdog on Replica Proxies
  when:
    - inventory_hostname != cert_primary_host
    - enable_fallback_watchdog | bool
  tags: [proxy, ssl, certs, watchdog]
  block:
    - name: Deploy acme-fallback-watchdog.sh script on Replica Proxies
      ansible.builtin.template:
        src: acme-fallback-watchdog.sh.j2
        dest: /usr/local/bin/acme-fallback-watchdog.sh
        owner: root
        group: root
        mode: "0755"

    - name: Configure daily cron job for ACME fallback watchdog
      ansible.builtin.cron:
        name: "acme-fallback-renewal-watchdog"
        minute: "25"
        hour: "3"
        user: root
        job: "/usr/local/bin/acme-fallback-watchdog.sh >/dev/null 2>&1"
        state: present
