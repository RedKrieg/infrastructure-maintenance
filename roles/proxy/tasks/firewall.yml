---
# ==============================================================================
# Firewall Rules for HAProxy
# ==============================================================================

- name: Allow HTTP (port 80) through UFW
  community.general.ufw:
    rule: allow
    port: "{{ haproxy_bind_http_port }}"
    proto: tcp
  tags: [proxy, firewall, ufw]

- name: Allow HTTPS (port 443) through UFW
  community.general.ufw:
    rule: allow
    port: "{{ haproxy_bind_https_port }}"
    proto: tcp
  tags: [proxy, firewall, ufw]

- name: Allow HAProxy stats web port through UFW
  community.general.ufw:
    rule: allow
    port: "{{ haproxy_stats_port }}"
    proto: tcp
  when: haproxy_enable_stats | bool
  tags: [proxy, firewall, ufw]

- name: Allow internal ACME challenge proxying between proxies (port 8888)
  community.general.ufw:
    rule: allow
    port: "{{ acme_standalone_port }}"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ internal_proxy_subnets }}"
  tags: [proxy, firewall, ufw]

- name: Allow internal ACME challenge proxying from peer proxy IPs (port 8888)
  community.general.ufw:
    rule: allow
    port: "{{ acme_standalone_port }}"
    proto: tcp
    from_ip: "{{ hostvars[item]['ansible_host'] | default(item) }}"
  loop: "{{ groups['proxies'] | default([]) }}"
  when: groups['proxies'] is defined
  tags: [proxy, firewall, ufw]
