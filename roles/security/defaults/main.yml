---
# ==============================================================================
# Default Variables for security Role
# ==============================================================================

enable_ufw_firewall: true
enable_ssh_daemon_hardening: true

# SSH Server Authentication & Keepalive Settings
ssh_max_auth_tries: 10
ssh_client_alive_interval: 120
ssh_client_alive_count_max: 3

# External SSH Connection Rate Limiting (3 connections/sec with burst of 15; internal RFC1918 exempt)
ssh_rate_limit_per_second: 3
ssh_rate_limit_burst: 15
