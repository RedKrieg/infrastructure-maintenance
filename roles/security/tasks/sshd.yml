---
# ==============================================================================
# SSH Daemon Hardening & Server Keepalives
# ==============================================================================

- name: Harden SSH daemon
  when: enable_ssh_daemon_hardening | bool
  tags: [security, ssh, sshd]
  block:
    - name: Ensure /etc/ssh/sshd_config.d directory exists
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure sshd_config includes drop-in configurations from sshd_config.d
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        line: "Include /etc/ssh/sshd_config.d/*.conf"
        insertafter: BOF
        state: present

    - name: Deploy SSH daemon hardening drop-in configuration
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/01-hardening.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          # Managed by Ansible - SSH Daemon Hardening & Server Keepalives
          PasswordAuthentication no
          PermitRootLogin prohibit-password
          PubkeyAuthentication yes
          KbdInteractiveAuthentication no
          X11Forwarding no
          MaxAuthTries {{ ssh_max_auth_tries }}
          ClientAliveInterval {{ ssh_client_alive_interval }}
          ClientAliveCountMax {{ ssh_client_alive_count_max }}
      notify: Restart sshd
