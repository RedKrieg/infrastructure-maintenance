---
# ==============================================================================
# UFW Firewall Configuration
# ==============================================================================

- name: Configure UFW firewall
  when: enable_ufw_firewall | bool
  tags: [security, firewall, ufw]
  block:
    - name: Install UFW
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Configure rate limiting on SSH (port 22/tcp)
      community.general.ufw:
        rule: limit
        port: "22"
        proto: tcp

    - name: Set UFW default incoming policy to deny
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Set UFW default outgoing policy to allow
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Enable UFW firewall service
      community.general.ufw:
        state: enabled
