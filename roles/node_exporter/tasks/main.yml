---
# ==============================================================================
# Main Task Entry Point for node_exporter Role
# ==============================================================================

- name: Manage Prometheus Node Exporter
  when: enable_node_exporter | bool
  tags: [monitoring, node_exporter, telemetry]
  block:
    - name: Install prometheus-node-exporter package
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present

    - name: Allow node_exporter port through UFW
      community.general.ufw:
        rule: allow
        port: "{{ node_exporter_port | string }}"
        proto: tcp
        from_ip: "{{ item }}"
        comment: "Prometheus Node Exporter"
      loop: "{{ node_exporter_trusted_subnets }}"
      when: enable_ufw_firewall | default(true) | bool

    - name: Ensure Prometheus textfile collector directory exists
      ansible.builtin.file:
        path: /var/lib/prometheus/node-exporter
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure Prometheus configuration directory exists
      ansible.builtin.file:
        path: /etc/prometheus
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: node_exporter_enable_tls | bool

    - name: Deploy Node Exporter TLS web-config file
      ansible.builtin.copy:
        dest: "{{ node_exporter_web_config_path }}"
        content: |
          tls_server_config:
            cert_file: {{ node_exporter_ssl_cert }}
            key_file: {{ node_exporter_ssl_key }}
            client_ca_file: {{ node_exporter_ca_cert }}
            client_auth_type: VerifyClientCertIfGiven
        owner: root
        group: root
        mode: "0640"
      when: node_exporter_enable_tls | bool
      notify: Restart node_exporter

    - name: Configure Prometheus node_exporter arguments
      ansible.builtin.lineinfile:
        path: /etc/default/prometheus-node-exporter
        regexp: "^ARGS="
        line: 'ARGS="--collector.textfile.directory=/var/lib/prometheus/node-exporter{{ " --web.config.file=" ~ node_exporter_web_config_path if (node_exporter_enable_tls | bool) else "" }}"'
        state: present
        create: true
        mode: "0644"
      notify: Restart node_exporter

    - name: Ensure prometheus-node-exporter service is enabled and started
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        state: started
        enabled: true
