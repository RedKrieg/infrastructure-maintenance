---
# ==============================================================================
# Per-User Setup for Admin: {{ current_admin_user.name }}
# ==============================================================================

- name: "Ensure primary group exists for {{ current_admin_user.name }}"
  ansible.builtin.group:
    name: "{{ current_admin_user.name }}"
    state: present

- name: "Create user account for {{ current_admin_user.name }}"
  ansible.builtin.user:
    name: "{{ current_admin_user.name }}"
    group: "{{ current_admin_user.name }}"
    groups:
      - sudo
    append: true
    shell: "{{ current_admin_user.shell | default('/bin/bash') }}"
    create_home: true
    state: present

- name: "Configure passwordless sudo for {{ current_admin_user.name }}"
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ current_admin_user.name }}"
    content: "{{ current_admin_user.name }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
  when: current_admin_user.sudo_nopasswd | default(true) | bool

- name: "Ensure user directories exist for {{ current_admin_user.name }}"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ current_admin_user.name }}"
    group: "{{ current_admin_user.name }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "/home/{{ current_admin_user.name }}/.ssh", mode: "0700" }
    - { path: "/home/{{ current_admin_user.name }}/.ssh/{{ ssh_control_subdir }}", mode: "0700" }
    - { path: "/home/{{ current_admin_user.name }}/.bash_completion.d", mode: "0755" }
    - { path: "/home/{{ current_admin_user.name }}/Projects", mode: "0755" }
    - { path: "/home/{{ current_admin_user.name }}/.local/bin", mode: "0755" }
    - { path: "/home/{{ current_admin_user.name }}/bin", mode: "0755" }
    - { path: "/home/{{ current_admin_user.name }}/.vim/autoload", mode: "0755" }
    - { path: "/home/{{ current_admin_user.name }}/.vim/bundle", mode: "0755" }

- name: "Deploy authorized SSH keys for {{ current_admin_user.name }}"
  ansible.posix.authorized_key:
    user: "{{ current_admin_user.name }}"
    state: present
    key: "{{ item }}"
  loop: >-
    {{
      (current_admin_user.authorized_keys | default([])) +
      ([current_admin_user.key] if current_admin_user.key is defined else []) +
      ([lookup('ansible.builtin.file', current_admin_user.key_file)] if current_admin_user.key_file is defined else [])
    }}

- name: "Configure SSH client ControlMaster and ControlPath for {{ current_admin_user.name }}"
  ansible.builtin.copy:
    dest: "/home/{{ current_admin_user.name }}/.ssh/config"
    owner: "{{ current_admin_user.name }}"
    group: "{{ current_admin_user.name }}"
    mode: "0600"
    content: |
      # Managed by Ansible - SSH Client Multiplexing Configuration
      Host *
          ControlMaster auto
          ControlPath {{ ssh_control_path }}
          ControlPersist {{ ssh_control_persist_seconds }}
          ServerAliveInterval 60
          ServerAliveCountMax 3

- name: "Deploy ~/.vimrc for {{ current_admin_user.name }}"
  ansible.builtin.copy:
    src: "{{ admin_vimrc_file }}"
    dest: "/home/{{ current_admin_user.name }}/.vimrc"
    owner: "{{ current_admin_user.name }}"
    group: "{{ current_admin_user.name }}"
    mode: "0644"

- name: "Install pathogen.vim for {{ current_admin_user.name }}"
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/tpope/vim-pathogen/master/autoload/pathogen.vim
    dest: "/home/{{ current_admin_user.name }}/.vim/autoload/pathogen.vim"
    owner: "{{ current_admin_user.name }}"
    group: "{{ current_admin_user.name }}"
    mode: "0644"
  ignore_errors: true

- name: "Configure ~/.selected_editor for {{ current_admin_user.name }}"
  ansible.builtin.copy:
    dest: "/home/{{ current_admin_user.name }}/.selected_editor"
    owner: "{{ current_admin_user.name }}"
    group: "{{ current_admin_user.name }}"
    mode: "0644"
    content: |
      # Generated by Ansible
      SELECTED_EDITOR="{{ default_editor_bin }}"

- name: "Deploy ~/.bashrc_addons for {{ current_admin_user.name }}"
  ansible.builtin.copy:
    src: "{{ admin_bashrc_addons_file }}"
    dest: "/home/{{ current_admin_user.name }}/.bashrc_addons"
    owner: "{{ current_admin_user.name }}"
    group: "{{ current_admin_user.name }}"
    mode: "0644"

- name: "Deploy ~/.venv_helpers.bash for {{ current_admin_user.name }}"
  ansible.builtin.copy:
    src: "{{ admin_venv_helpers_file }}"
    dest: "/home/{{ current_admin_user.name }}/.venv_helpers.bash"
    owner: "{{ current_admin_user.name }}"
    group: "{{ current_admin_user.name }}"
    mode: "0644"

- name: "Deploy workon-completion.bash for {{ current_admin_user.name }}"
  ansible.builtin.copy:
    src: "{{ admin_workon_completion_file }}"
    dest: "/home/{{ current_admin_user.name }}/.bash_completion.d/workon-completion.bash"
    owner: "{{ current_admin_user.name }}"
    group: "{{ current_admin_user.name }}"
    mode: "0644"

- name: "Ensure ~/.bashrc sources ~/.bashrc_addons for {{ current_admin_user.name }}"
  ansible.builtin.blockinfile:
    path: "/home/{{ current_admin_user.name }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: BASHRC_ADDONS"
    owner: "{{ current_admin_user.name }}"
    group: "{{ current_admin_user.name }}"
    mode: "0644"
    block: |
      if [ -f ~/.bashrc_addons ]; then
          . ~/.bashrc_addons
      fi
