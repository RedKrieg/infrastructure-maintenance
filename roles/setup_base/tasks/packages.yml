---
# ==============================================================================
# Package Installation & Apt Cache Management
# ==============================================================================

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install sysadmin troubleshooting and core packages
  ansible.builtin.apt:
    name: "{{ sysadmin_packages }}"
    state: present
