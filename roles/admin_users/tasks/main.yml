---
# ==============================================================================
# Main Task Entry Point for admin_users Role
# ==============================================================================

- name: Provision configured administrative users
  ansible.builtin.include_tasks: user_setup.yml
  loop: "{{ admin_users }}"
  loop_control:
    loop_var: current_admin_user
    label: "{{ current_admin_user.name }}"
  tags: [users, dotfiles, venv]
