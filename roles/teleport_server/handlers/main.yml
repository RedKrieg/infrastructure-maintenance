---
# ==============================================================================
# Handlers for teleport_server Role
# ==============================================================================

- name: Restart teleport
  ansible.builtin.systemd:
    name: teleport
    state: restarted

- name: Reload teleport
  ansible.builtin.systemd:
    name: teleport
    state: reloaded

- name: Restart teleport-access-watcher
  ansible.builtin.systemd:
    name: teleport-access-watcher
    daemon_reload: true
    state: restarted
  when: teleport_access_watcher_enabled | default(true) | bool
