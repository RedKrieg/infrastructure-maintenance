---
# ==============================================================================
# Teleport Server Package Installation
# ==============================================================================

- name: Install APT transport and gnupg prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - gnupg
      - curl
    state: present
  tags: [teleport, teleport_server, packages]

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [teleport, teleport_server, packages]

- name: Download Teleport GPG signing key
  ansible.builtin.get_url:
    url: "https://apt.releases.teleport.dev/gpg"
    dest: /usr/share/keyrings/teleport-archive-keyring.asc
    owner: root
    group: root
    mode: "0644"
  tags: [teleport, teleport_server, packages]

- name: Configure Teleport APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/teleport-archive-keyring.asc] https://apt.releases.teleport.dev/ubuntu {{ ansible_distribution_release if (ansible_distribution_release is defined and ansible_distribution_release in ['focal', 'jammy', 'noble']) else 'noble' }} stable/v{{ teleport_version }}"
    state: present
    filename: teleport
    update_cache: true
  tags: [teleport, teleport_server, packages]

- name: Install Teleport package
  ansible.builtin.apt:
    name: teleport
    state: present
  tags: [teleport, teleport_server, packages]
