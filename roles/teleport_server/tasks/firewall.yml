---
# ==============================================================================
# Firewall Rules for Teleport Server (UFW)
# ==============================================================================

- name: Allow Teleport Web UI / Proxy port (3080) through UFW
  community.general.ufw:
    rule: allow
    port: "{{ teleport_proxy_web_port | string }}"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ teleport_admin_trusted_cidrs | default(['0.0.0.0/0']) }}"
  tags: [teleport, teleport_server, firewall, ufw]

- name: Allow Teleport SSH proxy port (3023) through UFW
  community.general.ufw:
    rule: allow
    port: "{{ teleport_proxy_ssh_port | string }}"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ teleport_admin_trusted_cidrs | default(['0.0.0.0/0']) }}"
  tags: [teleport, teleport_server, firewall, ufw]

- name: Allow Teleport reverse tunnel port (3024) through UFW
  community.general.ufw:
    rule: allow
    port: "{{ teleport_proxy_tunnel_port | string }}"
    proto: tcp
  tags: [teleport, teleport_server, firewall, ufw]

- name: Allow Teleport Auth service port (3025) through UFW from trusted subnets
  community.general.ufw:
    rule: allow
    port: "{{ teleport_auth_service_port | string }}"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ teleport_trusted_subnets }}"
  tags: [teleport, teleport_server, firewall, ufw]
