---
# ==============================================================================
# Teleport Server Configuration and Service Management
# ==============================================================================

- name: Ensure Teleport configuration and data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - /etc/teleport
    - /var/lib/teleport
  tags: [teleport, teleport_server, config]

- name: Deploy Teleport Auth & Proxy configuration file
  ansible.builtin.template:
    src: teleport.yaml.j2
    dest: /etc/teleport.yaml
    owner: root
    group: root
    mode: "0640"
  notify: Restart teleport
  tags: [teleport, teleport_server, config]

- name: Ensure Teleport service is enabled and started
  ansible.builtin.systemd:
    name: teleport
    state: started
    enabled: true
  tags: [teleport, teleport_server, service]

- name: Wait for Teleport Auth service to become ready
  ansible.builtin.wait_for:
    port: "{{ teleport_auth_service_port }}"
    delay: 2
    timeout: 30
  tags: [teleport, teleport_server, service]
