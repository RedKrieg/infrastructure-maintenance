---
# ==============================================================================
# Tasks: PostgreSQL Engine Provisioning & Configuration
# ==============================================================================

- name: Install PostgreSQL server and client libraries
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
    state: present
    update_cache: false

- name: Discover installed PostgreSQL version and configuration path
  ansible.builtin.find:
    paths: /etc/postgresql
    file_type: directory
    recurse: false
  register: pg_version_dirs

- name: Set PostgreSQL configuration directory
  ansible.builtin.set_fact:
    pg_conf_dir: "{{ (pg_version_dirs.files | map(attribute='path') | sort | last) ~ '/main' }}"

- name: Configure PostgreSQL listen_addresses
  ansible.builtin.lineinfile:
    path: "{{ pg_conf_dir }}/postgresql.conf"
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = '{{ postgresql_listen_addresses }}'"
    state: present
  notify: restart postgresql

- name: Configure PostgreSQL listening port
  ansible.builtin.lineinfile:
    path: "{{ pg_conf_dir }}/postgresql.conf"
    regexp: "^#?port\\s*="
    line: "port = {{ db_port }}"
    state: present
  notify: restart postgresql

- name: Configure PostgreSQL max_connections and shared_buffers
  ansible.builtin.lineinfile:
    path: "{{ pg_conf_dir }}/postgresql.conf"
    regexp: "^#?{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.val }}"
    state: present
  loop:
    - { key: "max_connections", val: "{{ postgresql_max_connections }}" }
    - { key: "shared_buffers", val: "{{ postgresql_shared_buffers }}" }
  notify: restart postgresql

- name: Configure PostgreSQL Zero-Trust TLS encryption
  when: postgresql_enable_ssl | default(enable_internal_tls | default(false)) | bool
  block:
    - name: Grant postgres user ssl-cert group membership for internal TLS
      ansible.builtin.user:
        name: postgres
        groups: ssl-cert
        append: true
      notify: restart postgresql

    - name: Ensure PostgreSQL has read access to internal SSL private key via POSIX ACL
      ansible.posix.acl:
        path: /etc/ssl/internal/server.key
        entity: postgres
        etype: user
        permissions: r
        state: present
      failed_when: false

    - name: Enable SSL in postgresql.conf
      ansible.builtin.lineinfile:
        path: "{{ pg_conf_dir }}/postgresql.conf"
        regexp: "^#?ssl\\s*="
        line: "ssl = on"
        state: present
      notify: restart postgresql

    - name: Set SSL certificate paths in postgresql.conf
      ansible.builtin.lineinfile:
        path: "{{ pg_conf_dir }}/postgresql.conf"
        regexp: "^#?{{ item.key }}\\s*="
        line: "{{ item.key }} = '{{ item.val }}'"
        state: present
      loop:
        - { key: "ssl_cert_file", val: "/etc/ssl/internal/server.crt" }
        - { key: "ssl_key_file", val: "/etc/ssl/internal/server.key" }
        - { key: "ssl_ca_file", val: "/etc/ssl/certs/internal-ca.crt" }
      notify: restart postgresql

- name: Authorize trusted subnets in pg_hba.conf
  ansible.builtin.lineinfile:
    path: "{{ pg_conf_dir }}/pg_hba.conf"
    line: "host    all             all             {{ item }}            {{ postgresql_auth_method }}"
    insertafter: "^# IPv4 local connections:"
    state: present
  loop: "{{ db_trusted_subnets }}"
  notify: restart postgresql

# ------------------------------------------------------------------------------
# Replication & WAL Configuration (for Single-Primary & Replica Topologies)
# ------------------------------------------------------------------------------
- name: Configure replication WAL settings in postgresql.conf
  ansible.builtin.lineinfile:
    path: "{{ pg_conf_dir }}/postgresql.conf"
    regexp: "^#?wal_level\\s*="
    line: "wal_level = replica"
    state: present
  when: db_role in ['primary', 'standalone']
  notify: restart postgresql

- name: Authorize replication user in pg_hba.conf
  ansible.builtin.lineinfile:
    path: "{{ pg_conf_dir }}/pg_hba.conf"
    line: "host    replication     {{ db_replication_user }}     {{ item }}            {{ postgresql_auth_method }}"
    insertafter: "^# IPv4 local connections:"
    state: present
  loop: "{{ db_trusted_subnets }}"
  when: db_role in ['primary', 'standalone']
  notify: restart postgresql

- name: Allow PostgreSQL port through UFW from trusted subnets
  community.general.ufw:
    rule: allow
    port: "{{ db_port | string }}"
    proto: tcp
    from_ip: "{{ item }}"
    comment: "PostgreSQL Database Traffic"
  loop: "{{ db_trusted_subnets }}"
  when: enable_ufw_firewall | default(true) | bool

- name: Flush handlers to ensure PostgreSQL is running with new configuration
  ansible.builtin.meta: flush_handlers

- name: Ensure PostgreSQL service is started and enabled
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: true

# ------------------------------------------------------------------------------
# Replication User Provisioning
# ------------------------------------------------------------------------------
- name: Create PostgreSQL streaming replication user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ db_replication_user }}"
    password: "{{ db_replication_password }}"
    role_attr_flags: "REPLICATION,LOGIN"
    state: present
  when: db_role in ['primary', 'standalone']
  no_log: true

# ------------------------------------------------------------------------------
# User & Database Provisioning
# ------------------------------------------------------------------------------
- name: Create PostgreSQL application users
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ item.user }}"
    password: "{{ item.password }}"
    role_attr_flags: "LOGIN"
    state: present
  loop: "{{ active_db_list }}"
  when: db_role in ['primary', 'standalone']
  no_log: true

- name: Create PostgreSQL application databases
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ item.name }}"
    owner: "{{ item.user }}"
    state: present
  loop: "{{ active_db_list }}"
  when: db_role in ['primary', 'standalone']

- name: Grant all privileges on databases to respective users
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    database: "{{ item.name }}"
    roles: "{{ item.user }}"
    type: database
    privs: ALL
    state: present
  loop: "{{ active_db_list }}"
  when: db_role in ['primary', 'standalone']

# ------------------------------------------------------------------------------
# Connection Pooling (PgBouncer)
# ------------------------------------------------------------------------------
- name: Deploy PgBouncer connection pooler
  ansible.builtin.include_tasks: pgbouncer.yml
  when: enable_pgbouncer | bool
