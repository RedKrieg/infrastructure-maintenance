---
# ==============================================================================
# Main Task Entry Point for teleport_node Role
# ==============================================================================
# Target nodes only run the Teleport SSH daemon (outbound reverse tunnel) and
# do not receive workstation client helpers or overwrite teleport_servers config.
# ==============================================================================

- name: Manage Teleport SSH Node Service
  when:
    - enable_teleport_node | bool
    - inventory_hostname not in (groups['teleport_servers'] | default([]))
  block:
    - name: Install Teleport Node Package
      ansible.builtin.include_tasks: packages.yml
      tags: [teleport, teleport_node, packages]

    - name: Configure Teleport Node Service
      ansible.builtin.include_tasks: config.yml
      tags: [teleport, teleport_node, config, service]
