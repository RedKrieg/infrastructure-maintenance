---
# ==============================================================================
# Site Provisioning, Document Roots & SSL Certificate Management
# ==============================================================================

- name: Create site document roots and sample landing pages
  ansible.builtin.file:
    path: "{{ item.root | default('/var/www/' ~ item.name) }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  loop: "{{ webserver_sites }}"
  tags: [webserver, sites]

- name: Deploy initial landing page for enabled sites
  ansible.builtin.copy:
    dest: "{{ item.root | default('/var/www/' ~ item.name) }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"
    force: false
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
          <meta charset="UTF-8">
          <title>{{ item.domain }}</title>
          <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 50px; background: #f8fafc; color: #1e293b; }
              .card { background: white; border-radius: 8px; padding: 30px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); display: inline-block; max-width: 600px; }
              h1 { color: #0284c7; }
              .badge { background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 9999px; font-size: 0.875rem; font-weight: 600; }
          </style>
      </head>
      <body>
          <div class="card">
              <span class="badge">Backend Webserver Active</span>
              <h1>{{ item.domain }}</h1>
              <p>Served by backend node: <strong>{{ inventory_hostname }}</strong></p>
              <p>Routed via frontend HAProxy proxies on 10.0.0.0/8 subnet.</p>
          </div>
      </body>
      </html>
  loop: "{{ webserver_sites }}"
  tags: [webserver, sites]

- name: Ensure per-site SSL directories exist
  ansible.builtin.file:
    path: "/etc/ssl/acme.sh/{{ item.domain }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ webserver_sites }}"
  tags: [webserver, ssl]

- name: Check if SSL certificates already exist for sites
  ansible.builtin.stat:
    path: "/etc/ssl/acme.sh/{{ item.domain }}/fullchain.cer"
  register: site_cert_stats
  loop: "{{ webserver_sites }}"
  tags: [webserver, ssl]

- name: Generate bootstrap self-signed SSL certificates if certificates do not exist
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -nodes -days 365 -newkey rsa:2048
      -keyout /etc/ssl/acme.sh/{{ item.item.domain }}/{{ item.item.domain }}.key
      -out /etc/ssl/acme.sh/{{ item.item.domain }}/fullchain.cer
      -subj "/CN={{ item.item.domain }}"
  when: not item.stat.exists
  loop: "{{ site_cert_stats.results }}"
  tags: [webserver, ssl]

- name: Deploy Nginx virtual host configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ site.name }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ webserver_sites }}"
  loop_control:
    loop_var: site
  notify: Reload nginx
  tags: [webserver, sites]

- name: Enable configured virtual hosts
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item.name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ item.name }}.conf"
    state: "{{ 'link' if (item.enabled | default(true)) else 'absent' }}"
  loop: "{{ webserver_sites }}"
  notify: Reload nginx
  tags: [webserver, sites]

- name: Ensure Nginx service is enabled and started
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
  tags: [webserver, nginx]

- name: Issue Let's Encrypt certificates using acme.sh (when enabled)
  when: acme_issue_certs | bool
  tags: [webserver, acme, ssl]
  block:
    - name: Request certificates via acme.sh HTTP-01 webroot
      ansible.builtin.command:
        cmd: >
          {{ acme_sh_install_dir }}/acme.sh --issue
          -d {{ item.domain }}
          {% if item.aliases is defined %}{% for a in item.aliases %} -d {{ a }}{% endfor %}{% endif %}
          -w {{ acme_challenge_dir }}
          --keylength ec-256
          {% if acme_use_staging | bool %}--staging{% endif %}
      loop: "{{ webserver_sites }}"
      register: acme_issue_result
      failed_when: false
      changed_when: "'Cert success' in acme_issue_result.stdout"

    - name: Install issued certificates into Nginx paths
      ansible.builtin.command:
        cmd: >
          {{ acme_sh_install_dir }}/acme.sh --install-cert -d {{ item.domain }}
          --key-file /etc/ssl/acme.sh/{{ item.domain }}/{{ item.domain }}.key
          --fullchain-file /etc/ssl/acme.sh/{{ item.domain }}/fullchain.cer
          --reloadcmd "systemctl reload nginx"
      loop: "{{ webserver_sites }}"
      when: acme_issue_result is defined
      changed_when: false
