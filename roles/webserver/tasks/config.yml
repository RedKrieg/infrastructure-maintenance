---
# ==============================================================================
# Webserver Configuration, Generic 404 & Virtual Host Setup
# ==============================================================================

- name: Grant www-data user ssl-cert group membership for Nginx internal TLS
  ansible.builtin.user:
    name: www-data
    groups: ssl-cert
    append: true
  when: webserver_enable_ssl | bool
  notify: Reload nginx
  tags: [webserver, ssl, tls]

- name: Remove default Nginx welcome site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
  tags: [webserver, nginx]

- name: Deploy catch-all default server returning generic 404
  ansible.builtin.template:
    src: default_404.conf.j2
    dest: /etc/nginx/conf.d/00-default-404.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx
  tags: [webserver, nginx]

- name: Deploy HAProxy Real IP configuration in Nginx
  ansible.builtin.template:
    src: real_ip.conf.j2
    dest: /etc/nginx/conf.d/real_ip.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx
  tags: [webserver, nginx]

- name: Ensure site document root exists for external FQDN
  ansible.builtin.file:
    path: "{{ webserver_root_dir }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  tags: [webserver, sites]

- name: Deploy landing index.html for external FQDN
  ansible.builtin.copy:
    dest: "{{ webserver_root_dir }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"
    force: false
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
          <meta charset="UTF-8">
          <title>{{ external_fqdn }}</title>
          <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 50px; background: #f8fafc; color: #1e293b; }
              .card { background: white; border-radius: 8px; padding: 30px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); display: inline-block; max-width: 600px; }
              h1 { color: #0284c7; }
              .badge { background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 9999px; font-size: 0.875rem; font-weight: 600; }
          </style>
      </head>
      <body>
          <div class="card">
              <span class="badge">Backend Webserver Active</span>
              <h1>{{ external_fqdn }}</h1>
              <p>Served by backend host: <strong>{{ inventory_hostname }}</strong></p>
              <p>SSL terminated upstream on HAProxy proxies.</p>
          </div>
      </body>
      </html>
  tags: [webserver, sites]

- name: Deploy Nginx virtual host for external FQDN
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ external_fqdn }}.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx
  tags: [webserver, sites]

- name: Enable virtual host for external FQDN
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ external_fqdn }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ external_fqdn }}.conf"
    state: link
  notify: Reload nginx
  tags: [webserver, sites]

- name: Ensure Nginx service is enabled and started
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
  tags: [webserver, nginx]
