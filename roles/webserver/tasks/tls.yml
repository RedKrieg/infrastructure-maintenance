---
# ==============================================================================
# Internal TLS Certificate Provisioning & Automated Renewal for Webserver
# ==============================================================================
# Delegates certificate enrollment, trust-store registration, and systemd timer
# lifecycle to roles/internal_ca_client as the Single Source of Truth.
# ==============================================================================

- name: Manage Internal TLS Certificates for Zero-Trust Backend
  when: webserver_enable_ssl | bool
  tags: [webserver, ssl, tls]
  block:
    - name: Ensure ssl-cert package is installed for shared TLS key permissions
      ansible.builtin.apt:
        name: ssl-cert
        state: present

    - name: Grant www-data user ssl-cert group membership for Nginx internal TLS
      ansible.builtin.user:
        name: www-data
        groups: ssl-cert
        append: true
      notify: Reload nginx

    - name: Enroll webserver and maintain internal TLS certificate via internal_ca_client
      ansible.builtin.include_role:
        name: internal_ca_client
      vars:
        internal_ssl_cert_dir: "{{ webserver_ssl_cert_dir }}"
        internal_ssl_cert: "{{ webserver_ssl_cert }}"
        internal_ssl_key: "{{ webserver_ssl_key }}"
        internal_ssl_csr: "{{ webserver_ssl_csr }}"
        internal_ssl_ca_cert: "{{ webserver_ssl_ca_cert }}"
        internal_ssl_curve: "{{ webserver_ssl_curve }}"
        internal_ssl_digest: "{{ webserver_ssl_digest }}"
