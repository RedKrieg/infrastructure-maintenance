---
# ==============================================================================
# Default 404 Catch-All & Real IP Setup
# ==============================================================================

- name: Remove default Nginx welcome site symlink
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
  tags: [webserver, nginx]

- name: Deploy catch-all default server returning generic 404
  ansible.builtin.template:
    src: default_404.conf.j2
    dest: /etc/nginx/conf.d/00-default-404.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx
  tags: [webserver, nginx]

- name: Deploy HAProxy Real IP configuration in Nginx
  ansible.builtin.template:
    src: real_ip.conf.j2
    dest: /etc/nginx/conf.d/real_ip.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx
  tags: [webserver, nginx]
