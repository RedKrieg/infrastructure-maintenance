---
# ==============================================================================
# Default Variables for webserver (Nginx) Role
# ==============================================================================

# Web document root for this server's external FQDN
webserver_root_dir: "/var/www/{{ external_fqdn | default('html') }}"

# Trusted HAProxy subnets and fallback IPs for real_ip extraction
haproxy_trusted_subnets:
  - "10.0.0.0/8"
