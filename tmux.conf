# Enable mouse support for scrolling and pane selection
set -g mouse on

# 256 color terminal support
set -g default-terminal "screen-256color"

# Generous history scrollback buffer
set -g history-limit 10000

# Start window and pane numbering at 1 (matches keyboard order)
set -g base-index 1
setw -g pane-base-index 1

# Vi keybindings in copy mode
setw -g mode-keys vi

# Faster command sequences (zero delay on escape)
set -s escape-time 0

# Status bar styling
set -g status-style bg=black,fg=white
set -g status-left '#[fg=green,bold][#S] '
set -g status-right '#[fg=yellow]%Y-%m-%d %H:%M '
