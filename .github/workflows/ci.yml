name: CI Pipeline - Linting & Playbook Syntax Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-validate:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ansible Collections
        run: |
          ansible-galaxy collection install amazon.aws community.aws google.cloud azure.azcollection openstack.cloud community.general community.crypto community.postgresql community.mysql community.rabbitmq ansible.posix

      - name: Run Automated Test & Validation Suite
        run: |
          chmod +x tests/run_tests.sh
          ./tests/run_tests.sh
