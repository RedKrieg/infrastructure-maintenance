---
# ==============================================================================
# Group Variables for Frontend Proxies (HAProxy)
# ==============================================================================

# HAProxy listening ports
haproxy_bind_http_port: 80
haproxy_bind_https_port: 443

# Stats dashboard settings
haproxy_enable_stats: true
haproxy_stats_port: 8404
haproxy_stats_uri: "/stats"
haproxy_stats_user: "admin"
haproxy_stats_password: "SecureAdminPassword123"

# List of endpoints mapping domains and paths to backend webservers on 10/8 subnet
proxy_endpoints:
  - name: "app1_endpoint"
    frontend_port: 80
    ssl: true
    hosts:
      - "app1.example.com"
      - "www.app1.example.com"
    paths:
      - "/app1"
      - "/api"
    balance: "roundrobin"
    targets:
      - name: "web-01"
        ip: "10.0.1.11"
        port: 80
        ssl_port: 443
        check: true
      - name: "web-02"
        ip: "10.0.1.12"
        port: 80
        ssl_port: 443
        check: true
      - name: "web-03"
        ip: "10.0.1.13"
        port: 80
        ssl_port: 443
        check: true

  - name: "app2_endpoint"
    frontend_port: 80
    ssl: true
    hosts:
      - "app2.example.com"
    paths:
      - "/"
    balance: "roundrobin"
    targets:
      - name: "web-02"
        ip: "10.0.1.12"
        port: 80
        ssl_port: 443
        check: true
      - name: "web-03"
        ip: "10.0.1.13"
        port: 80
        ssl_port: 443
        check: true

  - name: "demo_endpoint"
    frontend_port: 80
    ssl: true
    hosts:
      - "demo.example.com"
    paths:
      - "/demo"
    balance: "leastconn"
    targets:
      - name: "web-01"
        ip: "10.0.1.11"
        port: 80
        ssl_port: 443
        check: true
