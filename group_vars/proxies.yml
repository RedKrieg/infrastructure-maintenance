---
# ==============================================================================
# Group Variables for Frontend Proxies (HAProxy)
# Role defaults in roles/proxy/defaults/main.yml provide sensible defaults.
# Use this file to define cluster-level overrides or environment credentials.
# ==============================================================================

# Stats dashboard password (configured via Ansible Vault)
haproxy_stats_password: "{{ vault_haproxy_stats_password | default('SecureAdminPassword123') }}"

# Set to true when your external FQDNs resolve via public DNS to proxy frontends
acme_issue_certs: false
acme_use_staging: false

# Restrict stats endpoint to trusted IP addresses, CIDR subnets, and FQDNs
# haproxy_stats_allowed_ips:
#   - "127.0.0.1"
#   - "10.0.0.0/8"
#   - "192.168.1.50"
#   - "admin.example.com"

# Zero-Trust Internal TLS Encryption to Backend Webservers
# When enabled, HAProxy re-encrypts upstream traffic over HTTPS (port 443)
# with strict cryptographic peer verification against the internal Root CA.
# haproxy_backend_ssl: true
# haproxy_backend_ssl_verify: "required" # "required" (default) or "none"
