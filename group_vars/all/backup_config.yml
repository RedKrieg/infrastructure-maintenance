---
# ==============================================================================
# Cluster Backup & Disaster Recovery Active Configuration
# ==============================================================================
# Supported destinations: "local", "remote_ssh", "s3", or "rclone".
# ==============================================================================

# Temporary staging directory on target nodes during archiving
backup_staging_dir: "/var/backups/ansible-cluster/staging"
backup_retention_days: 30
backup_compression: "gz"

# Destination type: "local", "remote_ssh", "s3", or "rclone"
backup_destination_type: "local"

# Local storage path on the Ansible controller / central storage host
backup_local_dir: "/var/backups/ansible-cluster/archives"

# Remote SSH / SFTP settings (when backup_destination_type is 'remote_ssh')
backup_remote_ssh_host: "backup.internal.lan"
backup_remote_ssh_port: 22
backup_remote_ssh_user: "backup"
backup_remote_ssh_key: "~/.ssh/id_ed25519"
backup_remote_ssh_dir: "/srv/backups/cluster"

# S3 / MinIO settings (when backup_destination_type is 's3')
backup_s3_bucket: "cluster-backups"
backup_s3_endpoint_url: ""
backup_s3_region: "us-east-1"
backup_s3_access_key: "{{ vault_backup_s3_access_key | default('') }}"
backup_s3_secret_key: "{{ vault_backup_s3_secret_key | default('') }}"
backup_s3_prefix: "cluster"

# Rclone Multi-Cloud Settings (when backup_destination_type is 'rclone')
# Supports 70+ backends: S3, MinIO, Cloudflare R2, Backblaze B2, GCS, Azure Blob, SFTP, WebDAV
backup_rclone_remote: "cluster-backup"
backup_rclone_path: "cluster-backups"
backup_rclone_config: "" # Leave empty for ~/.config/rclone/rclone.conf or provide custom path
backup_rclone_flags: "--fast-list --transfers 4 --checkers 8"
backup_rclone_bandwidth_limit: "" # e.g. "10M" or "50M"
backup_rclone_auto_install: true
backup_rclone_enable_retention_cleanup: true
