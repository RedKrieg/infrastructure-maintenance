---
# ==============================================================================
# Ansible Vault Sensitive Credentials & Secrets (Example Template)
# ==============================================================================
# Copy this file to group_vars/all/vault.yml and encrypt it:
#   cp group_vars/all/vault.example.yml group_vars/all/vault.yml
#   ansible-vault encrypt group_vars/all/vault.yml
# ==============================================================================

# HAProxy Statistics Dashboard & Prometheus Basic Auth Password
vault_haproxy_stats_password: "ReplaceWithYourSecureStatsPassword"

# Keepalived VRRP Authentication Secret (max 8 chars for VRRP PASS)
vault_keepalived_auth_pass: "Replace1"

# Teleport Cluster Node Join Token
vault_teleport_auth_token: "ReplaceWithYourTeleportJoinToken"

# Prometheus & Alertmanager Authentication
vault_prometheus_password: "ReplaceWithYourPrometheusPassword"
vault_alertmanager_smtp_password: "ReplaceWithYourSMTPPassword"

# Grafana Administrator Password
vault_grafana_admin_password: "ReplaceWithYourGrafanaAdminPassword"

# Initial Admin User Default Password (if not individually overridden)
vault_admin_default_password: "ReplaceWithYourAdminPassword"

# Teleport GitHub SSO OAuth Client Credentials
vault_teleport_github_client_id: "ReplaceWithYourGitHubOAuthClientID"
vault_teleport_github_client_secret: "ReplaceWithYourGitHubOAuthClientSecret"

# FreeIPA Identity Management Passwords & Enrollment OTP
vault_freeipa_admin_password: "ReplaceWithYourFreeIPAAdminPassword"
vault_freeipa_ds_password: "ReplaceWithYourFreeIPADirectoryManagerPassword"
vault_freeipa_client_otp: "ReplaceWithYourHostEnrollmentOTP"

# Cluster Internal CA Client Signing Authorization Token
vault_internal_ca_token: "ReplaceWithYourInternalCAToken"

# Relational Database Tier Passwords (PostgreSQL / MySQL)
vault_db_password: "ReplaceWithYourDatabaseAppPassword"
vault_db_replication_password: "ReplaceWithYourDatabaseReplicationPassword"

# In-Memory Cache Tier Password (Redis)
vault_redis_password: "ReplaceWithYourRedisPassword"

# Message Broker Tier Secrets (RabbitMQ)
vault_rabbitmq_password: "ReplaceWithYourRabbitMQAppPassword"
vault_rabbitmq_admin_password: "ReplaceWithYourRabbitMQAdminPassword"
vault_rabbitmq_erlang_cookie: "ReplaceWithYourRabbitMQErlangCookie"
