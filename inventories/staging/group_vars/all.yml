---
# ==============================================================================
# Staging Global Group Variables
# ==============================================================================

domain_name: "staging.example.com"

# Prevent burning Let's Encrypt production rate limits (50 certs/week/domain)
acme_use_staging: true

# Monitoring tuning for staging
prometheus_scrape_interval: "10s"
prometheus_evaluation_interval: "10s"
prometheus_retention_time: "7d"

# Staging email recipient override
alertmanager_email_from: "staging-alerts@example.com"
