# ==============================================================================
# Staging Environment Inventory
# ==============================================================================
# Isolated staging tier for pre-production validation, integration testing,
# and staging certificate validation without consuming Let's Encrypt rate limits.
# ==============================================================================

[proxies]
proxy-stage-01 ansible_host=10.0.10.10
proxy-stage-02 ansible_host=10.0.10.20

[webservers]
web-stage-01 ansible_host=10.0.10.11 external_fqdn=staging-web1.example.com
web-stage-02 ansible_host=10.0.10.12 external_fqdn=staging-web2.example.com

[monitoring]
monitoring-stage-01 ansible_host=10.0.10.50

[teleport_servers]
teleport-stage-01 ansible_host=10.0.10.60

[freeipa_servers]
# Optional: Dedicated FreeIPA server host when using identity_provider=freeipa

[databases]
# Optional Database Layer: Staging PostgreSQL (preferred) or MySQL server
# db-stage-01 ansible_host=10.0.10.40 db_engine=postgresql

[redis_servers]
# Optional In-Memory Cache & Session Store
# redis-stage-01 ansible_host=10.0.10.45

[rabbitmq_servers]
# Optional Message Broker & Task Queue
# mq-stage-01 ansible_host=10.0.10.46

[headless_nodes:children]
proxies
webservers
monitoring
teleport_servers
freeipa_servers
databases
redis_servers
rabbitmq_servers

[headless_nodes:vars]
ansible_user=ubuntu
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
