# ==============================================================================
# Production Environment Inventory
# ==============================================================================
# High-availability production cluster with multi-proxy ingress, 1:1 dynamic
# backend mapping, centralized logging, Teleport zero-trust access, and monitoring.
# ==============================================================================

[proxies]
proxy-prod-01 ansible_host=10.0.1.10
proxy-prod-02 ansible_host=10.0.1.20
proxy-prod-03 ansible_host=10.0.1.30

[webservers]
web-prod-01 ansible_host=10.0.1.11 external_fqdn=web1.example.com
web-prod-02 ansible_host=10.0.1.12 external_fqdn=web2.example.com
web-prod-03 ansible_host=10.0.1.13 external_fqdn=web3.example.com

[monitoring]
monitoring-prod-01 ansible_host=10.0.1.50

[teleport_servers]
teleport-prod-01 ansible_host=10.0.1.60

[headless_nodes:children]
proxies
webservers
monitoring
teleport_servers

[headless_nodes:vars]
ansible_user=ubuntu
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
